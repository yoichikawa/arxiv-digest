<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI論文まとめ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root { --bg:#fff;--fg:#1a1a1a;--fg3:#888;--border:#e0e3e8; }
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--fg:#e8eaf0;--fg3:#6b7280;--border:#2a2f3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--fg:#e8eaf0;--fg3:#6b7280;--border:#2a2f3e;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',sans-serif;font-size:15px;line-height:1.8;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.container{max-width:760px;margin:0 auto}
.site-header{padding-block:40px 24px;border-bottom:1px solid var(--border);margin-bottom:32px}
.site-header h1{margin:0 0 8px;font-size:24px;font-weight:700}
.site-header p{margin:0;font-size:13px;color:var(--fg3)}
.empty{text-align:center;padding:80px 0;color:var(--fg3)}
</style>
</head>
<body>
<div class="container">
  <header class="site-header">
    <h1>AI論文まとめ</h1>
    <p>Semantic Scholarの影響力スコア順に厳選したAI論文の日本語要約集</p>
  </header>
  <p class="empty">論文はまだ追加されていません。GitHub Actionsが初回実行されると表示されます。</p>
</div>
</body>
</html>
