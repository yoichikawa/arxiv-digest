 について、時刻 $t-1$ では正解だったのに時刻 $t$ で不正解になった回数を数え上げ、そのデータの「忘れやすさ」を算出する式です。"}, {"expression": "\\mathrm{Acc}(t) = \\frac{1}{N}\\sum_{i=1}^N \\mathbb{I}\\left(y_i = \\hat{y}_i^{(t)}\\right)", "meaning": "時刻 $t$ の時点で、全データ $N$ 個のうちAIが正しく予測できた割合（正解率）を計算する標準的な式です。"}], "addedDate": "2026-10-24"}, {"paperId": "7456dea3a3646f2df6392773a196a5abd0d53b11", "arxivId": "2101.03164", "title": "E(3)-equivariant graph neural networks for data-efficient and accurate interatomic potentials", "year": 2021, "published": "2021", "categories": [], "citationCount": 2543, "influentialCitationCount": 148, "url": "https://arxiv.org/abs/2101.03164", "summary": "分子や材料の動きをコンピュータ上で再現するシミュレーションでは、原子同士に働く力を正確に計算する必要があります。しかし、従来のAIモデルは分子を回転させると計算結果の向きが狂ってしまいやすく、物理的な法則を完全に再現するのが困難でした。そこで研究チームは、3次元空間の回転や反転を行っても力の向きや大きさが自然に追随する性質（E(3)等変性）を組み込んだモデル「NequIP」を開発しました。このモデルは、単なる数値だけでなく向きの情報を持つ幾何学的な量を直接ニューラルネットワークで扱います。その結果、極めて少ない実験データからでも、物理法則に矛盾しない高精度な原子の力やエネルギーを計算できるようになりました。", "terms": {"E(3)等変性": "入力した分子を回転させたり平行移動させたりすると、AIが予測する力や向きも全く同じように正しく連動して回転・移動する幾何学的な性質のことです。", "分子動力学シミュレーション": "原子や分子の間に働く力を計算し、時間とともにそれらがどのように動くかをコンピュータ上で追跡・再現する手法です。", "原子間ポテンシャル": "原子と原子の位置関係によって決まるエネルギーの大きさであり、原子同士に引き合う力や反発する力がどう働くかを決定づけるものです。"}, "formulas": [{"expression": "f(g \\cdot x) = g \\cdot f(x)", "meaning": "入力 $x$ に回転などの幾何学的操作 $g$ を加えたときの予測値は、もとの予測値 $f(x)$ を同じように回転させたものと完全に一致するという「等変性」の定義です。"}, {"expression": "\\mathbf{F}_i = -\\nabla_{\\mathbf{r}_i} E", "meaning": "分子全体のエネルギー $E$ が原子 $i$ の位置 $\\mathbf{r}_i$ によってどう変化するかを微分（勾配計算）することで、その原子にかかる力 $\\mathbf{F}_i$ を求める物理の基本法則です。"}], "addedDate": "2026-10-24"}, {"paperId": "3cf5f512b30187efa088b9ee6c4e9d8fa7f937ce", "arxivId": "", "title": "Accurate prediction of protein structures and interactions using a 3-track neural network", "year": 2021, "published": "2021", "categories": [], "citationCount": 3560, "influentialCitationCount": 145, "url": "https://www.semanticscholar.org/paper/3cf5f512b30187efa088b9ee6c4e9d8fa7f937ce", "summary": "タンパク質は生命活動に不可欠な物質ですが、そのアミノ酸の並び順から立体の形を突き止めることは長年の難問でした。本研究では、アミノ酸の1次元の配列情報、アミノ酸同士の2次元の距離関係、そして3次元の立体座標を同時に並行して処理するAI「RoseTTAFold」を開発しました。これら3つの異なる視点からの情報をニューラルネットワーク内で常に行き来させて修正し合うことで、高精度な構造予測を可能にしました。このシステムは、単一のタンパク質だけでなく、複数のタンパク質が合体した複合体の立体構造も正確に予測できます。計算に必要な時間も大幅に短縮され、創薬や生命科学の研究を支える有力な手法となりました。", "terms": {"タンパク質立体構造予測": "アミノ酸が一列に並んだ配列情報だけを手がかりにして、それが自然界で折りたたまれて作る複雑な3次元の形を当てる技術です。", "アミノ酸配列": "タンパク質を形作る基本部品であるアミノ酸が、どのような順番で鎖のように連結しているかを表す情報です。", "タンパク質複合体": "複数の独立したタンパク質分子が互いに引き合って組み合わさり、特定の働きをする巨大な分子のかたまりのことです。"}, "formulas": [{"expression": "\\mathbf{x}_i \\in \\mathbb{R}^3", "meaning": "タンパク質を構成する各部品 $i$ が、3次元空間のどの位置（X, Y, Z座標）にあるかを示しています。"}, {"expression": "\\mathbf{D}_{ij} = \\|\\mathbf{x}_i - \\mathbf{x}_j\\|_2", "meaning": "部品 $i$ と部品 $j$ の立体的な位置の直線距離（ユークリッド距離）を計算し、部品同士がどれくらい離れているかを表す式です。"}], "addedDate": "2026-10-24"}, {"paperId": "a1f8082505c7e90b0a033e1b9da0a97d67aad66c", "arxivId": "2302.01318", "title": "Accelerating Large Language Model Decoding with Speculative Sampling", "year": 2023, "published": "2023", "categories": [], "citationCount": 1230, "influentialCitationCount": 143, "url": "https://arxiv.org/abs/2302.01318", "summary": "ChatGPTのような大規模言語モデルは、単語を1つ出力するたびに巨大なAI全体を動かす必要があるため、文章の生成に時間がかかります。本研究では、この生成速度を劇的に引き上げる「推測サンプリング」というアルゴリズムを提案しました。この手法では、まず軽量で動作の速い小さなAIに数単語先まで「下書き」を一気に書かせます。その下書きが妥当かどうかを巨大な本命AIが一度の計算でまとめて検証し、合格した単語だけを採用します。この工夫により、巨大AIが単独で出力した時と数学的に全く同じ品質の文章を維持しながら、生成速度を2倍から3倍に高速化できました。", "terms": {"推測サンプリング": "小さなAIに先走って下書きを作らせ、大きなAIでまとめて検定することで、文章生成全体の時間を短縮する技術です。", "ドラフトモデル": "本命の巨大なAIの代わりに、品質は荒削りながらも超高速で文章の下書きを生成する小型のAIのことです。", "棄却サンプリング": "提案された候補をある確率に基づいて採用するか不採用にするかを振り分け、目的の確率分布通りの結果を得る統計手法です。"}, "formulas": [{"expression": "\\alpha = \\min\\left(1, \\frac{p(x)}{q(x)}\\right)", "meaning": "小さなAIが選んだ単語 $x$ の確率 $q(x)$ と、本命AIが計算した確率 $p(x)$ を比べ、その単語を下書きとしてそのまま採用する確率 $\\alpha$ を決める式です。"}, {"expression": "p(x) - q(x)", "meaning": "小さなAIが提案した単語を却下した際に、本命AIの本来の確率分布を狂わせないよう、埋め合わせとして別の単語を選び直す基準となる確率の差分です。"}], "addedDate": "2026-10-24"}, {"paperId": "7998468d99ab07bb982294d1c9b53a3bf3934fa6", "arxivId": "1807.05511", "title": "Object Detection With Deep Learning: A Review", "year": 2018, "published": "2018", "categories": [], "citationCount": 4915, "influentialCitationCount": 136, "url": "https://arxiv.org/abs/1807.05511", "summary": "画像の中に「何が」「どこに」写っているかを四角い枠で囲んで特定する物体検出は、自動運転や防犯カメラなど幅広く応用されています。かつては人間が手作業で特徴の計算ルールを作っていましたが、認識の精度や速度に限界がありました。この論文は、深層学習（ディープラーニング）の登場によって大きく進化した物体検出の技術を網羅的に整理した解説論文です。検出手法を、位置の候補を探してから分類する「2段階方式」と、位置と種類を同時に予測する「1段階方式」に分類し、それぞれの強みと弱みを明らかにしました。さらに、小さすぎる物体の見落としなど、当時の課題と今後の展望についても詳しく論じています。", "terms": {"物体検出": "画像の中から特定の対象物（車や人間など）を見つけ出し、その種類を当てると同時に位置を枠で囲んで示す技術です。", "バウンディングボックス": "検出した物体が画像のどこからどこまでに存在しているかを示す、長方形の境界枠のことです。", "CNN (畳み込みニューラルネットワーク)": "画像の中にある輪郭や模様などの局所的な特徴を効率よく見つけ出すことができる、画像認識に特化したAIの構造です。"}, "formulas": [{"expression": "\\mathrm{IoU} = \\frac{|A \\cap B|}{|A \\cup B|}", "meaning": "AIが予測した枠 $A$ と正解の枠 $B$ が重なっている面積を、両方を合わせた全体の面積で割ることで、枠の位置の正確さを0から1で評価する指標です。"}, {"expression": "\\mathrm{mAP} = \\frac{1}{C}\\sum_{c=1}^C \\mathrm{AP}_c", "meaning": "分類対象となるすべての種類 $C$ について個別に正解率を計算し、それらを平均して物体検出モデル全体の総合的な性能を表す指標です。"}], "addedDate": "2026-10-24"}, {"paperId": "561269a24f2f2a06409109723a8ab93a01696efc", "arxivId": "1610.02527", "title": "Federated Optimization: Distributed Machine Learning for On-Device Intelligence", "year": 2016, "published": "2016", "categories": [], "citationCount": 2298, "influentialCitationCount": 130, "url": "https://arxiv.org/abs/1610.02527", "summary": "スマートフォンなどの端末には個人の貴重なデータが蓄積されますが、プライバシー保護の観点から1台の中央サーバーに集めてAIを学習させることは困難です。そこで著者らは、データを端末の外に出さずに賢いAIを育てる「連合最適化（連合学習の基礎）」という枠組みを提唱しました。この方法では、各端末が手元にあるデータだけでAIを少しだけ賢くし、学習によって変化した設定値（パラメータ）の差分だけをサーバーに送信します。サーバーは集まった数多くの端末からの報告を平均して合体させ、改善された新しいモデルを端末に送り返します。通信回線が不安定な環境でも効率的に学習が進むよう設計されており、プライバシーを守る分散学習の標準的な考え方となりました。", "terms": {"連合学習": "ユーザーの手元にあるデータをサーバーに送信することなく、端末側で計算を行いパラメータだけを共有してAIを学習させる仕組みです。", "分散最適化": "1台のコンピュータではなく、ネットワークで繋がった多数の機器で手分けして計算を行い、最適な答えを見つけ出す手法です。", "パラメータ": "学習を通じてAIが賢くなる過程で、入力データから正しい予測を出すために内部で自動調整される数値データのことです。"}, "formulas": [{"expression": "\\min_{w} f(w) = \\sum_{k=1}^K \\frac{n_k}{n} F_k(w)", "meaning": "全 $K$ 台の端末がそれぞれ持っているデータの量 $n_k$ に応じて重み付けし、すべての端末にとって総合的に最も間違いが少なくなるモデル $w$ を探す目的の式です。"}, {"expression": "w_{t+1} = \\sum_{k=1}^K \\frac{n_k}{n} w_{t+1}^k", "meaning": "各端末 $k$ が手元のデータで更新した個別のパラメータ $w_{t+1}^k$ を、端末ごとのデータ数の比率に合わせて足し合わせ、中央サーバーで全体の新しいパラメータ $w_{t+1}$ を作成する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "e3d662bbd0e5539fe22a85f3518f960595b9914e", "arxivId": "", "title": "Heterogeneous Graph Neural Network", "year": 2019, "published": "2019", "categories": [], "citationCount": 1712, "influentialCitationCount": 129, "url": "https://www.semanticscholar.org/paper/e3d662bbd0e5539fe22a85f3518f960595b9914e", "summary": "ウェブ上のデータには、文字や画像といった多様な情報を持つ「ユーザー」「商品」「店舗」などが複雑に繋がり合う異種グラフが多く見られます。しかし、構造の複雑さと、要素に含まれる多様な文字や画像データを同時にうまく処理できるAIモデルは限られていました。そこで研究チームは、異なる種類の要素と属性をまとめて統合して学習できる「HetGNN」を提案しました。このモデルは、まず文字や画像などの特徴を個別に変換した上で、ランダムに繋がりをたどって周囲の仲間を集め、アテンション機構でどの繋がりを重視すべきか判断します。これにより、おすすめ商品の提示や関連ユーザーの予測といったシステムにおいて、極めて高い精度を発揮できるようになりました。", "terms": {"異種グラフ": "「人」「商品」「レビュー文章」のように、種類の異なる複数の要素と関係が複雑に絡み合ったネットワークのことです。", "ランダムウォーク": "ネットワークの線の上をサイコロを振るようにランダムに進んでいくことで、近くにある関連要素を効率よく拾い集める手法です。", "特徴量集約": "自分自身の周りに存在する近隣の要素から情報を集めて、自分自身をよりよく表す1つのまとまったデータへと合成する処理のことです。"}, "formulas": [{"expression": "h_v^t = \\mathrm{LSTM}\\left(\\{x_u : u \\in \\mathcal{N}_t(v)\\}\\right)", "meaning": "注目している要素 $v$ の周囲にある同じ種類 $t$ の仲間たち $\\mathcal{N}_t(v)$ から得た情報を、時系列処理で使われるLSTMという構造を使ってひとまとめに要約する式です。"}, {"expression": "\\alpha_{v, t} = \\frac{\\exp(\\mathrm{LeakyReLU}(\\mathbf{a}^\\top [h_v \\parallel h_v^t]))}{\\sum_{t'} \\exp(\\mathrm{LeakyReLU}(\\mathbf{a}^\\top [h_v \\parallel h_v^{t'}]))}", "meaning": "周囲から集めた異なる種類 $t$ の情報に対して、現在のタスクにおいてどれをどれくらい重視すべきかを表す重要度（アテンションの重み）を計算する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "0ef9ae1ce8c91ce671a211bdda792bf3752d1522", "arxivId": "", "title": "A Deep Learning Approach for Intrusion Detection Using Recurrent Neural Networks", "year": 2017, "published": "2017", "categories": [], "citationCount": 1776, "influentialCitationCount": 122, "url": "https://www.semanticscholar.org/paper/0ef9ae1ce8c91ce671a211bdda792bf3752d1522", "summary": "コンピュータネットワークへの不正な侵入を防ぐには、外部からの攻撃の兆候を素早く見つけ出す仕組みが必要です。この研究では、時系列データや連続したデータの処理が得意な「再帰型ニューラルネットワーク（RNN）」という技術を不正侵入検知に応用しました。通信記録の流れを順序立てて分析することで、正常なアクセスか攻撃かを高精度に見分けるモデルを作っています。実験では、正常と攻撃の二者択一だけでなく、攻撃の具体的な種類を当てる多クラス分類でも効果を検証しました。その結果、従来の仕組みに比べて高い精度で不正なアクセスを捉えられることが示されました。", "terms": {"侵入検知システム（IDS）": "ネットワーク上の通信を常に監視し、外部からの攻撃や不正アクセスを自動で見つけるセキュリティシステムです。", "再帰型ニューラルネットワーク（RNN）": "過去の情報を記憶しながらデータを順番に処理できる、文章や時間変化などの連続データを扱うのが得意なAI技術です。", "二値分類と多クラス分類": "データを「YesかNoか」の2通りに分けるのが二値分類で、「AかBかCか」のように3つ以上のグループに分けるのが多クラス分類です。"}, "formulas": [{"expression": "h_t = f(W x_t + U h_{t-1} + b)", "meaning": "現在の入力データと直前のステップの記憶（隠れ状態）を合わせて、現在の新しい記憶を計算するRNNの基本式です。"}, {"expression": "\\sigma(z) = \\frac{1}{1 + e^{-z}}", "meaning": "計算結果を0から1の間の確率のような数値に変換するシグモイド関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "0b500aa5fcc175f07aecf26c0e8ddc4f0c6a931d", "arxivId": "", "title": "GLoRIA: A Multimodal Global-Local Representation Learning Framework for Label-efficient Medical Image Recognition", "year": 2021, "published": "2021", "categories": [], "citationCount": 640, "influentialCitationCount": 114, "url": "https://www.semanticscholar.org/paper/0b500aa5fcc175f07aecf26c0e8ddc4f0c6a931d", "summary": "医療現場ではレントゲンなどの画像診断の需要が高まり、医師の負担を減らすAIの開発が進められています。しかし、高精度なAIを作るには医師が画像1枚1枚に正解ラベルを手作業で付ける必要があり、莫大な費用と時間がかかります。そこで本研究では、過去の医療画像と一緒に保管されている医師の診断テキスト報告書に着目しました。画像全体と文章全体の対応関係だけでなく、画像内の病変部位と報告書内の特定の単語の細かな対応も同時にAIに学ばせます。この工夫により、手作業の正解ラベルがほとんどない状態でも、画像から病変を高精度に見分けることに成功しました。", "terms": {"マルチモーダル学習": "画像とテキストなど、形式が異なる複数の種類のデータを組み合わせて一緒に学習するAIの手法です。", "対照学習": "意味が近いデータ同士は近くに、意味が異なるデータ同士は遠くになるように配置を調整して特徴を学ぶ学習法です。", "表現学習": "AIがデータの特徴（形や意味など）を扱いやすい数値のまとまりとして自動で抽出・整理する仕組みです。"}, "formulas": [{"expression": "s(u, v) = \\frac{u^\\top v}{\\|u\\| \\|v\\|}", "meaning": "画像の特徴ベクトルとテキストの特徴ベクトルの向きの近さ（類似度）を測るコサイン類似度の計算式です。"}, {"expression": "\\mathcal{L}_{NCE} = -\\log \\frac{\\exp(s_{pos} / \\tau)}{\\exp(s_{pos} / \\tau) + \\sum \\exp(s_{neg} / \\tau)}", "meaning": "対応する画像と文章の組み合わせの類似度を上げ、関係のない組み合わせの類似度を下げるように学習させる損失関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "b587ee7c802a5bd222a69090f59285e0dfdb29f1", "arxivId": "1702.03118", "title": "Sigmoid-Weighted Linear Units for Neural Network Function Approximation in Reinforcement Learning", "year": 2017, "published": "2017", "categories": [], "citationCount": 2852, "influentialCitationCount": 112, "url": "https://arxiv.org/abs/1702.03118", "summary": "ゲームやロボットの制御などを試行錯誤で学ばせる「強化学習」では、AIの頭脳としてニューラルネットワークが広く使われています。AIが複雑な物事を理解するためには、入力を変換して次の層へ送る「活性化関数」と呼ばれる計算の部品が非常に重要です。この研究では、滑らかな形状を持ち計算効率が良い「SiLU」と呼ばれる新しい活性化関数を提案しました。従来の関数と比べて、学習が途中で行き詰まりにくく、複雑な環境の状態を正確に捉えられる特性を持っています。実験では、古典的なゲームや制御問題において、既存の手法よりも素早く安定して良い行動を学習できることを実証しました。", "terms": {"強化学習": "AIが行動を試行錯誤し、うまくいったときにもらえる「報酬」を最大化するように行動方針を学ぶ学習方法です。", "活性化関数": "ニューラルネットワークの各計算ユニットで、入力された信号を次の段階にどう伝えるかを調整するスイッチのような数式です。", "関数近似器": "複雑に入り組んでいて正確な式が分からないデータや関係性を、大まかに再現・予測する仕組みのことです。"}, "formulas": [{"expression": "f(x) = x \\cdot \\sigma(x)", "meaning": "入力値そのものに入力値のシグモイド関数（0〜1の割合）を掛け合わせるSiLU関数の定義式です。"}, {"expression": "\\sigma(x) = \\frac{1}{1 + e^{-x}}", "meaning": "入力値を0から1の範囲に変換し、滑らかなゲートの役割を果たすシグモイド関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "6827b7abcdc6f9c0f91e239b4da394251aff35bd", "arxivId": "", "title": "Deep convolutional neural network for the automated detection and diagnosis of seizure using EEG signals", "year": 2017, "published": "2017", "categories": [], "citationCount": 1487, "influentialCitationCount": 107, "url": "https://www.semanticscholar.org/paper/6827b7abcdc6f9c0f91e239b4da394251aff35bd", "summary": "てんかんの発作を診断する際、脳の電気活動を記録した脳波（EEG）の波形を調べることが一般的です。しかし、長時間にわたる複雑な脳波を目視で確認する作業は、医師にとって大きな負担であり、専門性によって判断にバラつきが生じる課題がありました。そこで本研究では、画像認識などで実績のある「畳み込みニューラルネットワーク（CNN）」を用いて、脳波から発作の兆候を自動検知する仕組みを構築しました。脳波の波形データをAIが直接解析し、発作特有の異常なパターンを自動的に見つけ出します。実験の結果、高い精度で発作時の波形を自動識別でき、医療現場での診断支援ツールとしての実用性を示しました。", "terms": {"脳波（EEG）": "脳の神経細胞が活動するときに出る微弱な電気信号を、頭皮につけた電極から波形として記録したデータです。", "畳み込みニューラルネットワーク（CNN）": "画像や波形データなどから局所的な特徴（エッジや特有の波の形など）を取り出すことが得意なAIモデルです。", "自動検出": "人間が手作業で探す代わりに、プログラムやAIがデータの中から目的の現象や異常を自動で見つけ出すことです。"}, "formulas": [{"expression": "y = \\text{ReLU}(W * x + b)", "meaning": "脳波データにフィルターを適用（畳み込み）し、不要な負の値をゼロにして重要な特徴だけを残す計算を表します。"}, {"expression": "\\mathcal{L} = -\\sum_{i} y_i \\log(\\hat{y}_i)", "meaning": "AIが予測した確率と実際の診断結果とのズレを測定し、学習で減らすべき誤差を計算するクロスエントロピー損失です。"}], "addedDate": "2026-10-24"}, {"paperId": "91fb815361fdbf80ff15ce4d783a41846bd99232", "arxivId": "2006.09963", "title": "GCC: Graph Contrastive Coding for Graph Neural Network Pre-Training", "year": 2020, "published": "2020", "categories": [], "citationCount": 1184, "influentialCitationCount": 106, "url": "https://arxiv.org/abs/2006.09963", "summary": "SNSの友人関係や分子構造のように、点と線でつながりを表すデータを「グラフ」と呼びます。これまでのグラフ用AIは、特定のネットワーク専用に一から作られることが多く、別のネットワークに知識を再利用（転移）することが困難でした。本研究では、言語AIのように事前学習を行って汎用的な基礎力を身につけさせる枠組み「GCC」を提案しました。GCCは、特定のグラフの名前や属性に頼らず、グラフの構造や繋がりのパターンそのものを対照学習によってAIに学ばせます。この手法により、一度学習したモデルをまったく見たことがない別の分野のグラフ解析にもそのまま応用できるようになりました。", "terms": {"グラフニューラルネットワーク（GNN）": "人や物などの要素（ノード）と、それらの関係（エッジ）からなるネットワーク構造を直接扱えるAIです。", "事前学習": "特定の目的の前に、大量の一般的なデータを使ってあらかじめ基礎的なパターンを学ばせておく手法です。", "転移学習": "あるデータや課題で学んだ知識を、別の似た課題に応用して素早く高精度なモデルを作る技術です。"}, "formulas": [{"expression": "\\mathcal{L} = -\\log \\frac{\\exp(q \\cdot k^+ / \\tau)}{\\exp(q \\cdot k^+ / \\tau) + \\sum_{i} \\exp(q \\cdot k^-_i / \\tau)}", "meaning": "同じグラフの似た部分同士のスコアを高くし、無関係な部分とのスコアを低く抑えるためのInfoNCE損失関数です。"}, {"expression": "sim(q, k) = \\frac{q^\\top k}{\\|q\\| \\|k\\|}", "meaning": "抽出したグラフ構造の特徴を表す2つの数値ベクトルの方向の一致度（類似度）を計算する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "14156438bafed28a626738630b5181b83ed5d79c", "arxivId": "2008.08692", "title": "Enhancing Graph Neural Network-based Fraud Detectors against Camouflaged Fraudsters", "year": 2020, "published": "2020", "categories": [], "citationCount": 830, "influentialCitationCount": 105, "url": "https://arxiv.org/abs/2008.08692", "summary": "金融取引やネットレビューにおける詐欺師を見つけるため、ユーザー同士のつながりを分析するグラフAI（GNN）が活用されています。しかし、巧妙な詐欺師は正体を隠すため、普通の一般ユーザーと仲良く見せかけたり、普通の人に似せたプロフィールを作ったりする「カモフラージュ」を行います。従来のGNNは周りのつながりを無差別に信じて計算するため、こうしたカモフラージュによって騙されてしまう弱点がありました。そこで本研究では、繋がっている相手が本当に信頼できる情報源かをふるいにかける仕組みを組み込んだGNNを開発しました。実験の結果、巧妙に隠蔽工作を行う詐欺グループに対しても、騙されずに高い精度で見破ることに成功しました。", "terms": {"カモフラージュ行動": "詐欺師がAIの検知を逃れるために、無関係な一般ユーザーと意図的につながったり普通の行動を真似たりする偽装工作です。", "近傍集約": "グラフAIにおいて、注目している点の特徴を決めるために、その周囲に直接つながっている点たちの情報を集める処理のことです。", "アテンション機構": "集める情報の中から、どれが重要でどれが無視してよいものかを重み付けして賢く選択する仕組みです。"}, "formulas": [{"expression": "h_v^{(l)} = \\sigma \\left( \\sum_{u \\in \\mathcal{N}(v)} \\alpha_{uv} W h_u^{(l-1)} \\right)", "meaning": "周囲のつながっている相手の中から、重要度（α）に応じて必要な情報だけを選んで自分の特徴を更新する計算式です。"}, {"expression": "\\alpha_{uv} = \\frac{\\exp(e_{uv})}{\\sum_{k} \\exp(e_{uk})}", "meaning": "周囲のユーザーがどれくらい信頼できそうかを比較し、全体で合計1になる割合として算出するソフトマックス関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "3dd906bc0947e56d2b7bf9530b11351bbdff2358", "arxivId": "", "title": "Computer Vision and Image Understanding", "year": null, "published": "None", "categories": [], "citationCount": 912, "influentialCitationCount": 104, "url": "https://www.semanticscholar.org/paper/3dd906bc0947e56d2b7bf9530b11351bbdff2358", "summary": "本項目は特定の研究論文ではなく、コンピュータビジョンと画像理解の分野における代表的な国際学術雑誌（ジャーナル）の名称です。この学術誌では、コンピュータに人間の目のような視覚を持たせるための幅広い先端研究が発表されています。具体的には、写真から物体を検出する技術や、3次元空間の復元、人物の動作認識、画像生成技術などが扱われます。理論的な数学モデルから産業応用に至るまで、視覚情報処理に関する信頼性の高い査読付き論文が世界中から投稿されています。工学や人工知能の発展を支える中核的な情報共有プラットフォームの一つです。", "terms": {"コンピュータビジョン": "写真や動画などの視覚データから、人間のように状況や物体を認識・理解する技術を研究する学問分野です。", "画像理解": "単に画像が何色かを見るだけでなく、そこに「誰がいて何をしているか」という文脈や意味まで解釈する技術です。", "学術雑誌（ジャーナル）": "研究者が最新の研究成果を論文として投稿し、他の専門家による審査（査読）を経て定期的に発行される専門誌です。"}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "fad8bd00bca79005f89a0b0e2aa13fddc864fe22", "arxivId": "2106.01357", "title": "Diffusion Schrödinger Bridge with Applications to Score-Based Generative Modeling", "year": 2021, "published": "2021", "categories": [], "citationCount": 825, "influentialCitationCount": 102, "url": "https://arxiv.org/abs/2106.01357", "summary": "画像生成AIで有名な「拡散モデル」は、画像に少しずつノイズを加えて砂嵐のような画像にし、それを逆向きに復元することで新しい画像を作り出します。しかし従来の手法では、数学的にきれいなノイズにするために何百回もの細かな変化ステップが必要で、計算に長い時間がかかっていました。この研究では、「シュレーディンガー橋」と呼ばれる、2つの状態の間を最も効率よく移動する確率的な最短経路を求める理論を応用しました。これにより、無駄な回り道をせず、少ないステップでノイズから綺麗な画像へと変換する経路を見つけられます。結果として、より自然で高品質なデータを従来よりも素早く生成できるようになりました。", "terms": {"拡散モデル": "データに徐々にノイズを混ぜていき、その逆のプロセス（ノイズ除去）をAIに学ばせることで新しいデータを生成する手法です。", "シュレーディンガー橋": "ある分布から別の分布へ、物理的に最も無駄なエネルギーを使わずに確率的に粒子を移動させる最適な軌道を見つける数学理論です。", "スコアベースモデル": "データが集まっている密度の高い方向（勾配＝スコア）をAIに学習させ、その案内に従って画像を復元していく生成手法です。"}, "formulas": [{"expression": "dx_t = f(x_t, t)dt + g(t)dw_t", "meaning": "時間の経過とともにデータがノイズによって少しずつ変化していく様子を記述する確率微分方程式（SDE）です。"}, {"expression": "\\nabla_x \\log p_t(x)", "meaning": "データがどのように存在しているかの山（確率分布）の登り坂の方向を示すスコア関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "63167c30b06aa6c3d76e09065ced0412090d6c3b", "arxivId": "2402.17764", "title": "The Era of 1-bit LLMs: All Large Language Models are in 1.58 Bits", "year": 2024, "published": "2024", "categories": [], "citationCount": 502, "influentialCitationCount": 100, "url": "https://arxiv.org/abs/2402.17764", "summary": "ChatGPTのような大規模言語モデル（LLM）は性能が高い一方で、巨大な計算機と膨大な電力・メモリを消費することが深刻な問題となっています。従来のモデルは1つの重みパラメータを16ビットの細かい数値で表していましたが、本研究はそれを「-1、0、1」の3つの値（1.58ビット相当）だけで表現する「BitNet b1.58」を提案しました。かけ算をほとんど行わず、単純な足し算と引き算だけで高速に計算できるため、メモリ使用量と消費電力を劇的に削減できます。さらに驚くべきことに、同じ規模の従来の16ビットモデルと同等の賢さを維持できることが確認されました。これにより、スマートフォンなどでも高性能なLLMを動かせる可能性が大きく拓かれました。", "terms": {"大規模言語モデル（LLM）": "膨大な文章を学習し、人間のように自然な対話や文章の要約・生成ができる巨大なAIシステムです。", "量子化": "AIが持つ膨大なパラメータの数値を大まかな表現に丸めることで、データ量を減らし計算を軽くする手法です。", "3値（三値化）": "数値を「-1」「0」「1」のたった3つの状態だけに制限して記録・計算する極端な軽量化技術です。"}, "formulas": [{"expression": "W \\in \\{-1, 0, 1\\}", "meaning": "AIの脳を構成する重みパラメータが「-1」「0」「1」の3種類しかとらないことを示しています。"}, {"expression": "\\widetilde{W} = \\text{RoundClip}\\left(\\frac{W}{\\gamma}, -1, 1\\right)", "meaning": "もともとの数値を平均的な大きさ（γ）で割り、四捨五入して-1から1の3つの値のいずれかに収める計算です。"}], "addedDate": "2026-10-24"}, {"paperId": "76305acf2bf94e3a5677f7547098eeffb6649706", "arxivId": "2106.06935", "title": "Neural Bellman-Ford Networks: A General Graph Neural Network Framework for Link Prediction", "year": 2021, "published": "2021", "categories": [], "citationCount": 559, "influentialCitationCount": 98, "url": "https://arxiv.org/abs/2106.06935", "summary": "SNSで「知り合いかもしれない人」を推薦したり、知識ネットワークで抜けている関係を埋めたりする課題を「リンク予測」と呼びます。本研究は、古くから地図の最短経路探索などで使われてきた「ベルマン・フォード法」の考え方を、最先端のグラフニューラルネットワーク（GNN）と融合させました。ある2つの点の間にある無数の「経路（通り道）」をたどりながら、関係性の強さを段階的に積み重ねて二者の関係を予測します。従来の手法が単純な足し算や掛け算で行っていた経路の計算を、柔軟なニューラルネットワークに置き換えて学習可能にしました。これにより、複雑に入り組んだネットワークであっても、未知のつながりを高精度に言い当てられるようになりました。", "terms": {"リンク予測": "ネットワーク構造の中で、現在つながっていない2つの要素が今後つながるか、または見えない関係があるかを予測するタスクです。", "ベルマン・フォード法": "スタート地点からゴール地点までの最短ルートを、途中の経由地を1歩ずつ広げながら効率的に計算する古典的なアルゴリズムです。", "知識グラフ": "世の中の知識や概念（人、場所、出来事など）を点とし、それらの関係（生まれた場所、職業など）を矢印で結んだ巨大なデータベースです。"}, "formulas": [{"expression": "d(u, v) = \\min_{w} \\{ d(u, w) + \text{cost}(w, v) \\}", "meaning": "地点uからvへの最短距離を、途中の経由地点wまでの距離と残りのコストの足し算で更新するベルマン・フォード法の基本原理です。"}, {"expression": "h_{(u, v)}^{(l)} = \\bigoplus_{w} \\left( h_{(u, w)}^{(l-1)} \\otimes e_{(w, v)} \\right)", "meaning": "直前までの経路の記憶と新しい線の関係を組み合わせ（⊗）、それらをまとめて足し合わせる（⨁）ことで2点間の関係を表現する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "f7566f1797eb36429acbb09e581d6b2918a50760", "arxivId": "", "title": "Foundations of Statistical Natural Language Processing", "year": 2001, "published": "2001", "categories": [], "citationCount": 6298, "influentialCitationCount": 515, "url": "https://www.semanticscholar.org/paper/f7566f1797eb36429acbb09e581d6b2918a50760", "summary": "コンピュータに人間の言葉を理解させる初期の研究では、文法規則を手作業で書き込む方法が主流でしたが、例外の多さに対処しきれないという問題がありました。そこで本書は、大量の文章データから確率や統計の計算を用いて言語を扱う統計的自然言語処理の基礎を体系化しました。数学的な基礎知識から、単語の頻度分析、品詞の推定、文章の分類まで幅広い技術を網羅しています。実際にプログラムを作成できるようにアルゴリズムの仕組みが具体的に解説されています。このアプローチにより、手書きの規則に頼らずにデータに基づいて頑健に言語を解析する手法が整理されました。", "terms": {"自然言語処理": "人間が普段使っている言葉（日本語や英語など）をコンピュータに処理・理解させる技術のことです。", "コーパス": "文法や使われ方を分析するために集められた、大量の電子的な文章データの集まりのことです。", "品詞タグ付け": "文章中のそれぞれの単語に対して、名詞や動詞などの品詞を自動で割り当てる処理のことです。", "統計的アプローチ": "人間がルールを細かく決める代わりに、大量の文章データから単語の出現確率を計算して言語を分析する手法です。"}, "formulas": [{"expression": "P(w_n \\mid w_1, \\dots, w_{n-1})", "meaning": "直前に現れた単語の並びを条件として、次に特定の単語が現れる確率を表す条件付き確率の式です。"}, {"expression": "H(X) = - \\sum_{x} P(x) \\log_2 P(x)", "meaning": "情報理論におけるエントロピーを表す式で、データに含まれる情報量や曖昧さの度合いを数値化します。"}], "addedDate": "2026-10-25"}, {"paperId": "084c55d6432265785e3ff86a2e900a49d501c00a", "arxivId": "", "title": "Book Reviews: Foundations of Statistical Natural Language Processing", "year": 1999, "published": "1999", "categories": [], "citationCount": 5729, "influentialCitationCount": 406, "url": "https://www.semanticscholar.org/paper/084c55d6432265785e3ff86a2e900a49d501c00a", "summary": "この文献は、統計的自然言語処理の包括的な手引書として出版された教科書の内容を紹介・評価した書評です。それまでの自然言語処理は人間が作った規則に基づく手法が中心でしたが、データと確率を重視する統計的手法が急速に主流となりつつありました。本書が確率論や情報理論の数学的基礎から実践的なアルゴリズムまでを幅広くカバーしている点が解説されています。読者が自らプログラムを組んでツールを作れるように構成されている点も言及されています。自然言語処理を学ぶ学生や研究者にとって必要な知識が一通り揃っていることが示されています。", "terms": {"書評": "出版された書籍の内容を要約し、その構成や読みやすさ、対象読者などを紹介する解説文のことです。", "情報理論": "情報の伝達量や曖昧さを数学的に測定・分析するための理論です。", "アルゴリズム": "問題を解決したり計算を行ったりするための、一連の明確な処理手順のことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "a2f38d03fd363e920494ad65a5f0ad8bd18cd60b", "arxivId": "2007.15779", "title": "Domain-Specific Language Model Pretraining for Biomedical Natural Language Processing", "year": 2020, "published": "2020", "categories": [], "citationCount": 2866, "influentialCitationCount": 325, "url": "https://arxiv.org/abs/2007.15779", "summary": "BERTのような大規模な言語モデルは、ウェブ上の文章などで事前学習することで高い性能を発揮しますが、医療や生物学などの専門分野では一般的な言葉とは異なる専門用語が多用されます。従来は一般的な文章で学習した既存モデルに専門用語を追加学習させる方法が一般的でした。本論文では、専門的な文章が十分に集まるのであれば、最初から生物医学の文献（PubMedなど）だけでゼロから事前学習した方が良いのではないかと検証しました。開発されたPubMedBERTは、専門分野の語彙を適切に捉えた辞書を一から構築して学習を行いました。その結果、従来の追加学習方式よりも医療分野の様々な言語処理タスクで高い精度を達成しました。", "terms": {"事前学習": "特定の目的を決める前に、大量の文章をあらかじめ読ませて言葉の基本的な意味やつながりを学ばせる練習のことです。", "専門分野（ドメイン）": "医学、法律、金融など、特定の知識や独特の専門用語が使われる限定された分野のことです。", "語彙（ボキャブラリ）": "言語モデルが認識できる単語や文字のパーツの登録リストのことです。", "PubMed": "生物医学や生命科学に関する学術論文の要約や文献情報を集めた世界的なデータベースです。"}, "formulas": [{"expression": "\\mathcal{L}_{MLM} = - \\sum_{i \\in M} \\log P(x_i \\mid \\tilde{X})", "meaning": "文章中の一部の単語を伏せ字にして元の単語を予測させる、マスク言語モデリングの損失関数を表す式です。"}], "addedDate": "2026-10-25"}, {"paperId": "28692beece311a90f5fa1ca2ec9d0c2ce293d069", "arxivId": "2107.13586", "title": "Pre-train, Prompt, and Predict: A Systematic Survey of Prompting Methods in Natural Language Processing", "year": 2021, "published": "2021", "categories": [], "citationCount": 5932, "influentialCitationCount": 323, "url": "https://arxiv.org/abs/2107.13586", "summary": "これまでの自然言語処理では、事前学習したモデルを解きたいタスク（感情分析や翻訳など）に合わせて専用データで再調整（ファインチューニング）するのが一般的でした。本論文は、モデル自体を改変する代わりに、入力文章を工夫する「プロンプト学習」という新しいアプローチを網羅的に整理した調査論文です。この手法では、入力文を「この映画は[空欄]だ」のようなテンプレートに変換し、モデルに空欄を穴埋めさせることで判定を行います。これにより、モデル自体をタスクごとに変更することなく、テキスト生成モデルの能力をそのまま多様な問題に活用できます。論文では、プロンプトの設計方法や穴埋め結果を分類ラベルに対応付ける仕組みを体系的に分類しています。", "terms": {"プロンプト": "AIに対して指示を出したり、回答を引き出したりするために与える質問文や入力テンプレートのことです。", "ファインチューニング": "大まかに学習を終えたモデルに対し、特定の用途（例：苦情メールの分類）に特化させるため追加で少量のデータを用いて調整することです。", "穴埋めタスク（Cloze task）": "文章の一部を空欄にして、そこに入る適切な単語を予測させる問題形式のことです。", "ゼロショット学習": "特定タスクのための訓練データを一切与えずに、指示文（プロンプト）のみから回答を導き出す学習方法のことです。"}, "formulas": [{"expression": "P(y \\mid x)", "meaning": "入力データ $x$ が与えられたときに、正解ラベル $y$ になる条件付き確率を表す式です。"}, {"expression": "x' = f_{\\text{prompt}}(x)", "meaning": "元の入力文章 $x$ をテンプレート関数に当てはめて、穴埋め箇所を含むプロンプト文 $x'$ に変換する処理を表す式です。"}], "addedDate": "2026-10-25"}, {"paperId": "c95383f251a62c63217586059c67f63507c3e839", "arxivId": "1910.03771", "title": "HuggingFace's Transformers: State-of-the-art Natural Language Processing", "year": 2019, "published": "2019", "categories": [], "citationCount": 4410, "influentialCitationCount": 321, "url": "https://arxiv.org/abs/1910.03771", "summary": "深層学習による自然言語処理ではTransformerと呼ばれる強力な仕組みが登場しましたが、モデルの構造が複雑で一般の研究者や開発者が手軽に使うのは困難でした。そこで著者らは、最新のTransformer系モデルを誰もが数行のコードで扱えるようにしたオープンソースのPythonライブラリを開発しました。このライブラリには、BERTやGPTなどの代表的な学習済みモデルが多数実装されており、PyTorchとTensorFlowの両方で共通して動かせます。モデルの重みデータもクラウド上から数行で自動ダウンロードして利用可能です。これにより、文章分類や要約などの高度な処理を迅速に実装できるようになり、言語モデルの利用障壁が大きく下がりました。", "terms": {"Transformer": "文章内の離れた単語同士の関係性を効率よく同時に計算できる、現代の自然言語処理モデルの基本構造のことです。", "オープンソース": "プログラムの設計図（ソースコード）が誰にでも無償で公開されており、改変や再配布が自由にできるソフトウェアのことです。", "PyTorch / TensorFlow": "AIや深層学習のモデルをプログラミングして動かすための代表的なソフトウェア基盤のことです。", "API": "ソフトウェアの機能を外部のプログラムから呼び出して簡単に利用できるようにした窓口のことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "57458bc1cffe5caa45a885af986d70f723f406b4", "arxivId": "", "title": "A unified architecture for natural language processing: deep neural networks with multitask learning", "year": 2008, "published": "2008", "categories": [], "citationCount": 6046, "influentialCitationCount": 302, "url": "https://www.semanticscholar.org/paper/57458bc1cffe5caa45a885af986d70f723f406b4", "summary": "当時の自然言語処理では、品詞判定や固有表現抽出などのタスクごとに個別の特徴量を人手で設計し、別々のシステムとして構築するのが通例でした。本論文は、そうした手作業の特徴量設計を行わず、1つの統一された多層ニューラルネットワークに文字列をそのまま入力する手法を提案しました。単語の意味を数値の並びとして自動学習する「単語埋め込み」を活用し、文章全体の構造を捉える畳み込みニューラルネットワークを導入しています。さらに、複数の関連するタスクを同時に1つのネットワークで学習させる「マルチタスク学習」を採用しました。その結果、手作業の言語知識に過度に依存することなく、複数の処理で高い精度を達成しました。", "terms": {"単語埋め込み（単語ベクトル）": "単語の意味を数十〜数百次元の数値のリスト（ベクトル）に変換し、意味の近さを計算できるようにする技術です。", "マルチタスク学習": "1つのモデルに複数の異なる作業（例：品詞判定と固有名詞の発見）を同時に学ばせ、互いの知識を共有させて性能を高める学習方法です。", "畳み込みニューラルネットワーク（CNN）": "画像認識でよく使われる仕組みで、データの局所的な特徴（単語の並びなど）をスライドしながら抽出する構造のことです。", "固有表現抽出": "文章の中から人名、地名、組織名などの特定の固有名詞を自動的に見つけ出す処理のことです。"}, "formulas": [{"expression": "x_i = C(w_i)", "meaning": "単語を表すインデックス $w_i$ を、ルックアップテーブル $C$ を通してベクトル表現 $x_i$ に変換する処理を表す式です。"}, {"expression": "\\max_{1 \\le t \\le T} [f(x)]_t", "meaning": "可変長の文章から最も強い特徴を1つ選び出して固定長の長さにまとめる、マックスプーリング処理を表す式です。"}], "addedDate": "2026-10-25"}, {"paperId": "cfdd423c8672a7b178ea85d56079328df4eea647", "arxivId": "", "title": "Steven Bird, Ewan Klein and Edward Loper: Natural Language Processing with Python, Analyzing Text with the Natural Language Toolkit", "year": 2010, "published": "2010", "categories": [], "citationCount": 3626, "influentialCitationCount": 262, "url": "https://www.semanticscholar.org/paper/cfdd423c8672a7b178ea85d56079328df4eea647", "summary": "本書は、プログラミング言語Pythonを用いて自然言語処理を基礎から実践的に学ぶための書籍およびツールの紹介です。付属のオープンソースライブラリ「NLTK」を使うことで、文章の分割から文法解析、意味の抽出までの処理を簡単なプログラムで動かせます。プログラミングの初心者でも理解できるように、言語学の概念とコードの実装例がステップ・バイ・ステップで対応付けられています。英語を中心とした豊富な実データ（コーパス）が最初からバンドルされており、手軽に言語分析の実験を始めることができます。教育用として広く普及し、自然言語処理の実践的な学習環境を整えるのに役立ちました。", "terms": {"Python": "読みやすく書きやすい文法を持ち、データ分析やAI開発に広く利用されているプログラミング言語です。", "NLTK": "自然言語処理を学習・研究するために作られた、Python向けの代表的な教育用ライブラリのことです。", "トークン化": "文章を単語や句読点といった最小限の意味の単位（トークン）に切り分ける作業のことです。", "構文解析": "文章の文法構造を分析し、主語や述語、修飾関係などのつながりを木構造として明らかにする処理のことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "641a9749fe546a02bbab9a86bfc91492db1c3bc5", "arxivId": "2003.07082", "title": "Stanza: A Python Natural Language Processing Toolkit for Many Human Languages", "year": 2020, "published": "2020", "categories": [], "citationCount": 2275, "influentialCitationCount": 260, "url": "https://arxiv.org/abs/2003.07082", "summary": "多くの言語処理ツールは特定の数カ国語にしか対応しておらず、多言語の文章を統一的に扱うのは困難でした。本論文では、世界66の言語に対応したPython向けの統合言語処理ツールキット「Stanza」を発表しました。テキストの分割、品詞や文法の解析、固有名詞の抽出といった一連の処理が、すべて最新のニューラルネットワークで構成されています。世界共通の文法基準であるUniversal Dependenciesに基づいて100以上のデータセットで学習されており、言語に依存しない柔軟な設計を持っています。利用者は数行のコードを記述するだけで、多様な言語の文章を高精度に自動解析できます。", "terms": {"係り受け解析": "文の中の単語同士がどのように修飾し合っているか（例：「美しい」が「花」にかかる）の関係性を解析する処理です。", "Universal Dependencies": "世界中の異なる言語の文法構造や品詞を、統一された共通ルールで記述することを目指す国際プロジェクトです。", "パイプライン": "単語の分割から品詞の判定、構文の解析まで、複数の処理ステップを順番に連結して実行する仕組みのことです。", "ニューラルネットワーク": "人間の脳の神経回路の仕組みを模倣した、データから自動でパターンを学習する計算モデルのことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "fb486e03369a64de2d5b0df86ec0a7b55d3907db", "arxivId": "", "title": "A Maximum Entropy Approach to Natural Language Processing", "year": 1996, "published": "1996", "categories": [], "citationCount": 3688, "influentialCitationCount": 256, "url": "https://www.semanticscholar.org/paper/fb486e03369a64de2d5b0df86ec0a7b55d3907db", "summary": "自然言語処理では、文章の意味を判定する際に多くの不完全な手がかり（周辺の単語や品詞など）を統合して判断する必要があります。本論文は、統計学や物理学で用いられる「最大エントロピー原理」を自然言語処理の様々な問題に応用する枠組みを提案しました。この原理は、既知の事実（データから得られた特徴）には忠実に従いつつ、それ以外の未知の部分については最も偏りのない一様な確率を割り当てるという考え方です。手作業で複雑な条件分岐ルールを組み合わせる必要がなく、複数の重複する特徴量を綺麗に1つの確率モデルにまとめられます。機械翻訳や文章の分割などに応用され、データに基づく柔軟な意思決定モデルとして機能しました。", "terms": {"最大エントロピー原理": "分かっている情報だけを満たし、それ以外に関しては最も偏りのない（エントロピーが最大となる）確率分布を選ぶという判断基準です。", "特徴関数": "「直前の単語がtheである」などの特定の条件が文章中に満たされているかどうかを、1か0かで判定する関数のことです。", "確率分布": "起こりうるすべての結果に対して、それぞれが発生する確率を割り当てた一覧のことです。", "正規化項（分配関数）": "計算されたすべての選択肢のスコアの合計値で、確率の総和が1になるように全体を割り算して調整する数値のことです。"}, "formulas": [{"expression": "p(y \\mid x) = \\frac{1}{Z(x)} \\exp\\left( \\sum_{i} \\lambda_i f_i(x, y) \\right)", "meaning": "特徴関数 $f_i$ とその重み $\\lambda_i$ を掛け合わせた値の合計から、条件付き確率を計算する最大エントロピーモデルの基本式です。"}, {"expression": "Z(x) = \\sum_{y} \\exp\\left( \\sum_{i} \\lambda_i f_i(x, y) \\right)", "meaning": "すべての候補ラベル $y$ についてのスコアを足し合わせ、確率の合計を1にするための正規化係数（分配関数）の式です。"}], "addedDate": "2026-10-25"}, {"paperId": "1254c99a381d1f9d6abb23c74be060e4e7876985", "arxivId": "", "title": "Book Reviews: Speech and Language Processing: An Introduction to Natural Language Processing, Computational Linguistics, and Speech Recognition", "year": 2000, "published": "2000", "categories": [], "citationCount": 3070, "influentialCitationCount": 226, "url": "https://www.semanticscholar.org/paper/1254c99a381d1f9d6abb23c74be060e4e7876985", "summary": "この文献は、音声認識とテキスト処理の両方を包括的に解説した代表的な教科書に対する書評です。それまで音声処理と自然言語処理は異なる学問分野として扱われることが多く、両者を統一的に学べる書籍はほとんどありませんでした。本書は、音声波形の分析から、単語の文法規則、さらには対話システムに至るまでを1冊で網羅しています。言語学的な理論だけでなく、確率モデルや隠れマルコフモデルなどの数理的アルゴリズムも丁寧に解説されています。音声とテキストを合わせた言語テクノロジー全般を初歩から体系的に学びたい読者に適した入門書であることが述べられています。", "terms": {"音声認識": "人間が話した音声の波形データをコンピュータで解析し、文字テキストに変換する技術のことです。", "隠れマルコフモデル（HMM）": "直接は見えない状態の変化（例：発音しようとしている音）を、観測できるデータ（例：マイクで拾った音声波形）から確率的に推定する統計モデルです。", "対話システム": "スマートスピーカーやチャットボットのように、人間とコンピュータが言葉でやり取りを行うシステムのことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "894149cb66e8af4a20c82840ea3f774888644fa6", "arxivId": "", "title": "Speech and language processing: an introduction to natural language processing, computational linguistics, and speech recognition, 2nd Edition", "year": 2000, "published": "2000", "categories": [], "citationCount": 2594, "influentialCitationCount": 225, "url": "https://www.semanticscholar.org/paper/894149cb66e8af4a20c82840ea3f774888644fa6", "summary": "本書は、人間が話す言葉や書く文章をコンピューターで処理するための技術を網羅的に解説した教科書です。単語の並びを確率で計算する言語モデルから、文の文法構造を解析する構文解析、さらには音声を文字に変換する音声認識まで、幅広い基礎技術を網羅しています。また、文章の意味をコンピューターに理解させる意味解析や、質問応答・機械翻訳といった実践的な応用システムの手法も取り上げています。数理的なアルゴリズムと実際の言語処理システムの両面を結びつけて説明しており、自然言語処理の基礎を体系的に学ぶことができます。", "terms": {"自然言語処理（NLP）": "人間が普段使っている言葉（日本語や英語など）をコンピューターに理解・処理させる技術のことです。", "構文解析": "文を単語や文法的なまとまりに分解し、どの単語がどの単語を修飾しているかという構造を明らかにする処理です。", "N-gram言語モデル": "直前の幾つかの単語の並びから、次にどんな単語が現れるかを確率で予測する手法です。", "形態素解析": "文章を意味を持つ最小の単位（形態素）に分割し、それぞれの品詞などを判別する処理です。"}, "formulas": [{"expression": "P(w_1, w_2, \\dots, w_n) = \\prod_{i=1}^n P(w_i \\mid w_1, \\dots, w_{i-1})", "meaning": "一連の単語が並んで文になる確率を、直前の単語群から次の単語が出る確率の掛け算として表す連鎖律の式です。"}, {"expression": "\\text{tf-idf}(t, d, D) = \\text{tf}(t, d) \\times \\log \\frac{|D|}{|\\{d \\in D : t \\in d\\}|}", "meaning": "文書内での単語の出現頻度と、全文書中でのその単語の珍しさを掛け合わせることで、単語の重要度を計算する式です。"}], "addedDate": "2026-10-25"}, {"paperId": "1a3f80af28be2a2c22fdd40379a9a2396de0b276", "arxivId": "", "title": "Natural-Language Processing", "year": 1982, "published": "1982", "categories": [], "citationCount": 3672, "influentialCitationCount": 185, "url": "https://www.semanticscholar.org/paper/1a3f80af28be2a2c22fdd40379a9a2396de0b276", "summary": "本論文は、1980年代初頭における自然言語処理の研究動向と、人間が日常的に使う言語をコンピューターに理解させるための基本的アプローチを解説した概論です。当時の研究では、文法規則に基づいて文の構造を分解する構文解析や、言葉の持つ意味を記号として表現する手法が中心となっていました。日常言語のあいまいさや、文脈に応じた意味の解釈、人間の常識知識をどのようにコンピューターに持たせるかといった根本的な難しさが論じられています。当時の人工知能研究において、言語処理が直面していた課題と可能性を分かりやすく示しています。", "terms": {"構文解析（パーシング）": "文法ルールを照らし合わせることで、文を主語や述語などの構成要素に分解して構造を解析することです。", "意味表現": "単語や文が表す概念や意味内容を、コンピューターが計算できるように記号や論理式で表したものです。", "あいまい性（曖昧性）": "同じ単語や文であっても、文脈や解釈の仕方によって複数の意味に取れてしまう性質のことです。"}, "formulas": [{"expression": "S \\rightarrow NP \\; VP", "meaning": "ひとつの文（S）は、名詞句（NP）と動詞句（VP）の組み合わせから作られるという基本的な文法生成規則を表しています。"}], "addedDate": "2026-10-25"}, {"paperId": "498238a3bd5fd322fc3ce1572e33bbe3853a356f", "arxivId": "1708.05866", "title": "A Brief Survey of Deep Reinforcement Learning", "year": 2017, "published": "2017", "categories": [], "citationCount": 3634, "influentialCitationCount": 149, "url": "https://arxiv.org/abs/1708.05866", "summary": "本論文は、試行錯誤を通じて最適な行動を学ぶ「強化学習」と、画像などの複雑なデータを認識できる「深層学習」を組み合わせた「深層強化学習」の全体像を整理した解説論文です。ゲームの画面を見ながら自ら操作を覚えてハイスコアを出す仕組みや、ロボットが手足の動かし方を自律的に習得する仕組みがどのような原理で動いているかを説明しています。行動の良し悪しを点数で評価する価値ベースの手法や、行動の選び方そのものを直接改善する方策ベースの手法など、主要なアプローチを分類して比較しています。深層強化学習の基本的な考え方から、学習の安定化に向けた工夫、そして今後の課題までを簡潔にまとめています。", "terms": {"強化学習": "コンピューターが試行錯誤を繰り返しながら、もらえる報酬（ご褒美の点数）が最大になるような行動の選び方を学ぶ仕組みです。", "Q学習": "ある状況である行動をとったときに、将来的にどれくらい報酬が得られるかという価値（Q値）を計算して学習する手法です。", "方策（ポリシー）": "現在の状況を見て、次にどんな行動をとるかを決めるルールのことです。"}, "formulas": [{"expression": "Q(s, a) = r + \\gamma \\max_{a'} Q(s', a')", "meaning": "現在の状態$s$で行動$a$をとったときの価値を、直後の報酬$r$と次に移った状態$s'$で得られる最大の価値の合計として計算するベルマン方程式です。"}, {"expression": "\\nabla_\\theta J(\\theta) = \\mathbb{E} \\left[ \\nabla_\\theta \\log \\pi_\\theta(a \\mid s) Q(s, a) \\right]", "meaning": "より良い行動が選ばれやすくなるように、方策パラメータ$\\theta$をどの方向に更新すべきかを計算する方策勾配の式です。"}], "addedDate": "2026-10-25"}, {"paperId": "93b4cc549a1bc4bc112189da36c318193d05d806", "arxivId": "1803.07640", "title": "AllenNLP: A Deep Semantic Natural Language Processing Platform", "year": 2018, "published": "2018", "categories": [], "citationCount": 1344, "influentialCitationCount": 133, "url": "https://arxiv.org/abs/1803.07640", "summary": "本論文は、深層学習を用いた自然言語処理の研究や開発を円滑に行うために作られたオープンソース基盤「AllenNLP」を紹介しています。言語モデルや質問応答などのモデルを作る際、データの読み込みや実験設定の管理など共通する多くのプログラムを毎回ゼロから書く必要があり、研究の再現性や拡張性に課題がありました。AllenNLPは、これらの処理を使いやすい部品として整理し、設定ファイルを記述するだけで実験ができる枠組みを提供します。これにより、研究者は細かな実装作業に煩わされることなく、新しいモデル構造の考案や比較検証に専念できるようになりました。", "terms": {"オープンソース": "プログラムの設計図（ソースコード）が無償で公開されており、誰でも自由に利用や改良ができるソフトウェアのことです。", "設定ファイル": "プログラム本体を書き換えることなく、モデルの構造や学習の回数などの条件を指定するための外部テキストファイルです。", "再現性": "他の研究者が同じ手順やデータを使ったときに、発表されたものと同じ実験結果を正しく再現できる度合いのことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "347bac45298f37cd83c3e79d99b826dc65a70c46", "arxivId": "1906.05474", "title": "Transfer Learning in Biomedical Natural Language Processing: An Evaluation of BERT and ELMo on Ten Benchmarking Datasets", "year": 2019, "published": "2019", "categories": [], "citationCount": 1018, "influentialCitationCount": 123, "url": "https://arxiv.org/abs/1906.05474", "summary": "本論文は、医療や生命科学の文章を対象とした自然言語処理のために、総合的な性能評価ベンチマーク「BLUE」を構築した研究です。医学論文や電子カルテのテキストなど、性質の異なる10種類のデータセットを集め、専門用語の抽出や病名の関係分類といった多様なタスクを用意しました。この基準を用いて、一般的な文章で学習したBERTやELMoと、医学文献を事前学習させたモデルの性能を詳細に比較検証しています。その結果、医学分野に特化した文章で事前学習を行ったモデルのほうが、医療用語の理解において高い精度を発揮することを明らかにしました。", "terms": {"転移学習": "ある分野の大量のデータで学んだ基礎的な知識を、別の具体的な問題に引き継いで応用する機械学習の手法です。", "事前学習": "特定のタスクを解かせる前に、あらかじめ膨大な文章を読ませて言葉の並びや一般的な知識を覚えさせる学習段階のことです。", "ベンチマーク": "複数のモデルや手法の性能を同じ条件で公平に比較するために用意された標準的なテストセットのことです。"}, "formulas": [{"expression": "F_1 = 2 \\cdot \\frac{\\text{Precision} \\cdot \\text{Recall}}{\\text{Precision} + \\text{Recall}}", "meaning": "正解した割合（適合率）と見逃さなかった割合（再現率）の調和平均をとることで、モデルの総合的な正確さを測る評価指標です。"}], "addedDate": "2026-10-25"}, {"paperId": "ad14227e4f51276892ffc37aa43fd8750bb5eba8", "arxivId": "1910.00177", "title": "Advantage-Weighted Regression: Simple and Scalable Off-Policy Reinforcement Learning", "year": 2019, "published": "2019", "categories": [], "citationCount": 996, "influentialCitationCount": 118, "url": "https://arxiv.org/abs/1910.00177", "summary": "本論文は、通常の教師あり学習と同じ感覚で扱える、シンプルで安定した強化学習手法「AWR（Advantage-Weighted Regression）」を提案しています。従来の強化学習は計算が不安定になりやすく、過去に集めた行動記録（オフポリシーデータ）を効率よく活用することが難しいという問題がありました。AWRは、「状況の価値を予測する学習」と「平均より良い結果を出した行動を真似する学習」という2つの標準的な予測問題の組み合わせで動作します。これにより、アルゴリズムの仕組みが平易になり、ロボットの動作学習などの複雑なタスクでも安定して高い性能を発揮できるようになりました。", "terms": {"オフポリシー学習": "現在学習中の行動方針とは異なる、過去の記録や別の方針で集めた行動データを使って学習を進める手法です。", "アドバンテージ": "ある状況でとった行動が、その状況における平均的な行動と比べてどれくらい良かったかを示す指標です。", "教師あり学習": "入力データとそれに対応する正解ラベルのペアをコンピューターに見せて、正解を予測できるように訓練する手法です。"}, "formulas": [{"expression": "A(s, a) = Q(s, a) - V(s)", "meaning": "状態$s$で行動$a$をとった場合の価値$Q$から、その状態の平均的な価値$V$を引くことで、その行動が平均よりどれだけ優れていたか（アドバンテージ）を計算します。"}, {"expression": "\\arg\\max_\\theta \\mathbb{E}_{(s, a) \\sim \\mathcal{D}} \\left[ \\exp\\left(\\frac{1}{\\beta} A(s, a)\\right) \\log \\pi_\\theta(a \\mid s) \\right]", "meaning": "アドバンテージが高い良い行動ほど大きな重みをかけて、その行動をとる確率が高くなるように方策$\\pi_\\theta$を更新する目的関数です。"}], "addedDate": "2026-10-25"}, {"paperId": "2cbea7615ebecea2c414d8fbad47d5d258a5c3b4", "arxivId": "2208.06193", "title": "Diffusion Policies as an Expressive Policy Class for Offline Reinforcement Learning", "year": 2022, "published": "2022", "categories": [], "citationCount": 768, "influentialCitationCount": 118, "url": "https://arxiv.org/abs/2208.06193", "summary": "本論文は、画像生成などで高い成果を上げている「拡散モデル」を、事前に集めた固定データのみから学習する「オフライン強化学習」に応用した研究です。既存の強化学習手法では、「右に避けるか左に避けるか」のような複数の有望な選択肢がある状況で、単純な平均をとってしまい中途半端な失敗行動を選ぶという課題がありました。本手法では、拡散モデルが持つ高い表現力を活用し、複数の異なる行動の候補をきれいに保ったまま学習できるようにしました。これにより、人間や機械が集めた不完全な行動データからでも、状況に応じて適切な最善手を選べるようになり、ロボット制御などで高い性能を達成しました。", "terms": {"オフライン強化学習": "環境との新たな試行錯誤を行わず、あらかじめ保存された過去のデータセットのみを用いて安全に方針を学ぶ手法です。", "拡散モデル": "データに少しずつノイズを加えて壊したあと、そのノイズを段階的に取り除く手順を学習することで、リアルなデータを生成する手法です。", "マルチモーダル性": "正解や最適な選択肢が1つだけではなく、複数の異なる山（正解候補）に分かれて存在している性質のことです。"}, "formulas": [{"expression": "p_\\theta(a^{i-1} \\mid a^i, s) = \\mathcal{N}(a^{i-1}; \\mu_\\theta(a^i, s, i), \\Sigma_i)", "meaning": "ノイズを含んだ行動$a^i$と現在の状態$s$から、少しノイズを取り除いた行動$a^{i-1}$を予測する逆拡散ステップの確率分布です。"}, {"expression": "\\pi(s) = \\arg\\max_{a} Q(s, a)", "meaning": "現在の状態$s$において、将来得られる見込み価値$Q$が最も高くなるような最適な行動$a$を選択することを表しています。"}], "addedDate": "2026-10-25"}, {"paperId": "452059171226626718eb677358836328f884298e", "arxivId": "1506.07285", "title": "Ask Me Anything: Dynamic Memory Networks for Natural Language Processing", "year": 2015, "published": "2015", "categories": [], "citationCount": 1224, "influentialCitationCount": 106, "url": "https://arxiv.org/abs/1506.07285", "summary": "本論文は、質問応答や感情分析など、多様な自然言語処理の課題を解くことができる「動的メモリネットワーク（DMN）」を提案しています。このモデルは、入力された文章を読み込む部分、質問を理解する部分、記憶を更新しながら何度も推論を重ねるエピソード記憶部分、そして答えを出力する部分から構成されています。質問の内容に応じて文章中の関係ありそうな箇所に注意（アテンション）を向け、見つけた情報をもとにさらに別の関連箇所を探すという反復的な思考が可能です。これにより、文章の複数箇所に散らばった情報を論理的につなぎ合わせて正しい回答を導き出す能力が大きく向上しました。", "terms": {"アテンション（注意機構）": "入力された文章全体の中で、今解くべき問題に最も関係が深い単語や文に重みを置いて注目する仕組みです。", "質問応答（QA）": "与えられた文章とそれに関する質問を読み、文章の内容に基づいた正しい答えを自動で導き出すタスクです。", "GRU（ゲート付き回帰型ユニット）": "過去の情報を記憶し、どの記憶を残してどの記憶を忘れるかを調整しながら文脈を読み解くニューラルネットワークの部品です。"}, "formulas": [{"expression": "g_t^i = G(c_t, m^{i-1}, q)", "meaning": "入力文の各要素$c_t$、前回の記憶$m^{i-1}$、質問$q$を比較して、その文にどれくらい注目すべきかの度合い（アテンションゲート）$g_t^i$を計算する式です。"}, {"expression": "m^i = \\text{GRU}(e^i, m^{i-1})", "meaning": "注目した情報から抽出した新しいエピソード$e^i$を使って、記憶の状態$m^{i-1}$を次の記憶$m^i$へと更新する処理を表しています。"}], "addedDate": "2026-10-25"}, {"paperId": "f1c0aad419cd942d5a135b47fcce58d101dbb3bd", "arxivId": "2507.19457", "title": "GEPA: Reflective Prompt Evolution Can Outperform Reinforcement Learning", "year": 2025, "published": "2025", "categories": [], "citationCount": 611, "influentialCitationCount": 105, "url": "https://arxiv.org/abs/2507.19457", "summary": "本論文は、大規模言語モデル（LLM）に与える指示文（プロンプト）を、生物の進化のように自動で改良していく最適化手法「GEPA」を提案しています。LLMを特定の仕事向けに調整する際、従来の強化学習では何千回もの試行と単純な点数評価が必要で、非常に多くの計算コストがかかっていました。GEPAは、AI自身に失敗原因を自然言語で反省させ、その反省文をもとに複数の評価基準を同時に満たすようプロンプトを進化させていきます。数値の点数だけでなく言語による詳細なフィードバックを使うことで、強化学習よりもはるかに少ない試行回数で効率的に高品質な指示文を見つけ出せることを示しました。", "terms": {"プロンプト": "大規模言語モデルに対して、どのような役割や指示で作業を行ってほしいかを伝える入力テキストのことです。", "パレート最適": "複数の目標（例：正確さと簡潔さ）があるとき、他の目標を犠牲にしない限り、これ以上改善できないバランスの良い状態のことです。", "遺伝的アルゴリズム": "生物の進化（選択・交差・突然変異）の仕組みを真似て、候補を少しずつ変化させながら最善の答えを探し出す手法です。"}, "formulas": [{"expression": "u \\succ v \\iff (\\forall i, u_i \\ge v_i) \\land (\\exists i, u_i > v_i)", "meaning": "候補$u$がすべての評価項目で候補$v$以上であり、かつ少なくとも1つの項目で優れているとき、$u$が$v$を支配（圧倒）していると定義するパレート支配の式です。"}], "addedDate": "2026-10-25"}, {"paperId": "d16ab5c19ed33a263b6412ac41a4ea1f068d254a", "arxivId": "2004.13922", "title": "Revisiting Pre-Trained Models for Chinese Natural Language Processing", "year": 2020, "published": "2020", "categories": [], "citationCount": 947, "influentialCitationCount": 101, "url": "https://arxiv.org/abs/2004.13922", "summary": "本論文は、英語で成功を収めた事前学習言語モデル「BERT」を中国語に適用した際の性能を体系的に検証し、改良モデル「MacBERT」を提案した研究です。従来の中国語モデルでは単語を隠して当てさせる学習を行っていましたが、本研究では中国語の特性に合わせて単語単位で隠す工夫や、より大規模なデータでの学習を行いました。さらにMacBERTでは、文字を伏字記号に置き換えるのではなく、似た意味や音を持つ別の文字に置き換えてそれを元の文字に直させる手法を導入しました。この工夫により、事前学習時と実際のタスク利用時との文章の見た目のギャップが解消され、多様な中国語タスクで性能が向上しました。", "terms": {"BERT": "文章の前後両方向の文脈を同時に考慮して、単語の意味を高精度に捉えることができる深層学習の言語モデルです。", "マスク言語モデル（MLM）": "文章の一部の単語を伏字にして隠し、周囲の文脈から隠された単語を予測させることで言葉の扱い方を学ばせる仕組みです。", "事前学習モデル": "膨大なテキストデータをあらかじめ読み込んで基礎的な言葉の意味や文法を習得させた、再利用可能なAIモデルのことです。"}, "formulas": [{"expression": "\\mathcal{L}_{\\text{MLM}} = - \\sum_{i \\in M} \\log P(x_i \\mid \\tilde{X})", "meaning": "隠されたり置き換えられたりした単語の位置$M$において、周囲の文脈$\\tilde{X}$から正解の単語$x_i$を正しく予測できた確率をもとに計算する損失（誤差）の式です。"}], "addedDate": "2026-10-25"}, {"paperId": "2fdb536da39a014c598ea67b0db88431fcd852a8", "arxivId": "1511.03722", "title": "Doubly Robust Off-policy Value Evaluation for Reinforcement Learning", "year": 2015, "published": "2015", "categories": [], "citationCount": 775, "influentialCitationCount": 98, "url": "https://arxiv.org/abs/1511.03722", "summary": "強化学習では、コンピューターが試行錯誤を通じて最適な行動ルールを学びます。しかし、現実世界では危険な行動を試すことが難しいため、過去の別の方策で集めたデータを活用して新しいルールの性能を予測したいという需要があります。従来の予測手法には、予測結果が大きくブレやすいか、または偏った予測になりやすいという欠点がありました。そこで本研究は、「重要度サンプリング」と「環境のモデル予測」という2つの手法を賢く組み合わせる手法を提案しました。この方法により、どちらか一方の手法が失敗しても補い合うことができ、過去のデータからより正確かつ安定して性能を見積もることが可能になりました。", "terms": {"強化学習": "コンピューターが試行錯誤を繰り返しながら、最も多くの報酬を得られる行動の仕方を学ぶ仕組みです。", "オフポリシー評価": "新しい行動ルールを実際に試す代わりに、過去に別のルールで集めた記録を使って、その性能を評価する技術です。", "重要度サンプリング": "データが集められた環境と、本当に評価したい環境の違いを比率で補正して計算する統計の手法です。", "二重頑健性（Doubly Robust）": "2つの異なる予測アプローチを組み合わせ、どちらか片方の仮定が正しければ推定が破綻しないようにする性質のことです。"}, "formulas": [{"expression": "\\rho_t = \\frac{\\pi(a_t | s_t)}{\\mu(a_t | s_t)}", "meaning": "過去の行動ルール $\\mu$ と新しく評価したいルール $\\pi$ の間で、ある状態 $s_t$ において同じ行動 $a_t$ を選ぶ確率の比率（重み）を表します。"}, {"expression": "V^{\\text{DR}} = \\hat{V}(s_0) + \\sum_{t=0}^T \\gamma^t \\left( \\prod_{i=0}^t \\rho_i \\right) (r_t - \\hat{Q}(s_t, a_t))", "meaning": "二重頑健（DR）推定量による評価値の計算式で、モデルの予測値 $\\hat{V}$ を土台にしつつ、実際の報酬 $r_t$ とのズレを重要度比 $\\rho$ で補正して足し合わせることを示しています。"}], "addedDate": "2026-10-25"}, {"paperId": "ca1d5aa8f63707931692bf6a62642becf928c1fa", "arxivId": "2112.02244", "title": "LAVT: Language-Aware Vision Transformer for Referring Image Segmentation", "year": 2021, "published": "2021", "categories": [], "citationCount": 575, "influentialCitationCount": 97, "url": "https://arxiv.org/abs/2112.02244", "summary": "写真の中から「赤い服を着た女性」のように言葉で指定された特定の対象を見つけ出し、その輪郭を正確に切り抜く技術に関する研究です。従来の方式では、画像全体の特徴と言葉の特徴を別々に抽出したあと、最後の段階で無理に合体させていたため、細かい位置の対応関係を見失いやすい課題がありました。この論文では、画像を分析する処理の初期段階から言葉の情報を同時に取り込む「LAVT」という新しい仕組みを開発しました。画像の小さな領域を見るたびに言葉の関連性を確認しながら特徴を抽出するため、言葉と画像の結びつきがより強くなります。その結果、複雑な指示文であっても対象をより正確に切り抜くことができるようになりました。", "terms": {"Referring Image Segmentation": "「右端の黒い犬」などの言葉による説明を手がかりにして、画像内の該当する領域をピクセル単位で切り抜くタスクです。", "Vision Transformer (ViT)": "画像を細かな正方形のパッチに切り分け、文章を処理するように画像の特徴を捉える深層学習モデルです。", "マルチモーダル": "テキスト、画像、音声など、種類の異なる複数のデータ形式を一緒に扱う技術のことです。", "クロスアテンション": "文章中の単語と画像中の各部分を照らし合わせ、「どの言葉が画像のどこに対応しているか」を計算する仕組みです。"}, "formulas": [{"expression": "\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d}}\\right)V", "meaning": "画像の要素（問い合わせ $Q$）と言葉の要素（鍵 $K$）の類似度を計算し、その度合いに応じて言葉の情報（値 $V$）を画像側にブレンドする計算式です。"}, {"expression": "\\mathcal{L}_{\\text{BCE}} = -\\sum_{i} [y_i \\log(p_i) + (1 - y_i) \\log(1 - p_i)]", "meaning": "切り抜き領域の各ピクセルが正解（1）か背景（0）かを、予測確率 $p_i$ と照らし合わせてペナルティを計算する損失関数です。"}], "addedDate": "2026-10-25"}, {"paperId": "c48e2b6da0383e5602d883ca6b42354aea06e882", "arxivId": "", "title": "First-order and Stochastic Optimization Methods for Machine Learning", "year": 2020, "published": "2020", "categories": [], "citationCount": 473, "influentialCitationCount": 95, "url": "https://www.semanticscholar.org/paper/c48e2b6da0383e5602d883ca6b42354aea06e882", "summary": "機械学習のモデルを訓練するとは、膨大なデータに対して予測の誤りが最も小さくなるような設定値を探し出す作業です。この設定値を探すための代表的な手法が、勾配（坂の傾き）を利用して少しずつ良い方向へ値を更新する「最適化手法」です。本論文は、計算量を抑えつつ高速に正解へ近づくための様々な一次最適化手法と、その理論的背景を体系的にまとめた解説論文です。データの一部をランダムに取り出して効率よく計算する確率的勾配降下法（SGD）や、その発展形がどのような仕組みで収束していくかを整理しています。機械学習でモデルを効率的に学習させるための基礎原理を網羅的に理解できます。", "terms": {"最適化問題": "数あるパラメータの組み合わせの中から、最も予測エラーを小さくする最適な値を見つけ出すプロセスのことです。", "勾配（グラディエント）": "関数の値が最も急激に増える方向と傾きを示すベクトルのことで、この逆方向へ進むとエラーを減らせます。", "確率的勾配降下法（SGD）": "全データを一度に使わず、少量のデータをランダムに選びながらパラメータを小刻みに更新していく計算手法です。", "一次最適化手法": "計算を軽くするため、関数の1階微分（傾きの情報）のみを使って最適解を探すアプローチのことです。"}, "formulas": [{"expression": "w_{t+1} = w_t - \\alpha \\nabla f(w_t)", "meaning": "現在のパラメータ $w_t$ から、学習率 $\\alpha$ に勾配 $\\nabla f(w_t)$ を掛けた分を差し引くことで、よりエラーが小さくなる次の値 $w_{t+1}$ を求める基本式です。"}, {"expression": "\\mathbb{E}[g_t | w_t] = \\nabla f(w_t)", "meaning": "ランダムに選んだデータで計算した簡易的な勾配 $g_t$ の平均値（期待値）が、データ全体を使った真の勾配と一致することを示しています。"}], "addedDate": "2026-10-25"}, {"paperId": "2e5d2f2dc01b150dffc163a9f457848e9b5b5c38", "arxivId": "2007.15745", "title": "On Hyperparameter Optimization of Machine Learning Algorithms: Theory and Practice", "year": 2020, "published": "2020", "categories": [], "citationCount": 3005, "influentialCitationCount": 90, "url": "https://arxiv.org/abs/2007.15745", "summary": "AIや機械学習のモデルには、学習を始める前に人間があらかじめ決めておかなければならない「ハイパーパラメータ」という設定値が存在します。この設定が少し変わるだけでモデルの賢さが劇的に変化するため、最適な組み合わせを見つけることが不可欠です。本論文は、手作業の試行錯誤に頼らず、自動で最良の設定を探し出す「ハイパーパラメータ最適化」の理論と実践手法をまとめた調査論文です。単純にしらみつぶしに探す手法から、過去の試行結果を学習して賢く次の候補を絞り込むベイズ最適化までを比較しています。どのような問題にどの最適化技術を選ぶべきかの実用的な指針を整理しています。", "terms": {"ハイパーパラメータ": "AI自身がデータから学習するパラメータとは異なり、学習速度やモデルの規模など人間が外側から指定する設定値のことです。", "グリッドサーチ": "候補となる設定値を等間隔で格子状に並べ、そのすべての組み合わせを総当たりで試す最も単純な探索法です。", "ベイズ最適化": "過去に試した設定と性能の関係から「次はどこを試せば一番良くなりそうか」を確率モデルで予測しながら賢く探索する手法です。", "獲得関数": "ベイズ最適化において、次に試すべき最も有望なハイパーパラメータの候補地をスコアリングするための関数です。"}, "formulas": [{"expression": "x^* = \\arg\\min_{x \\in \\mathcal{X}} f(x)", "meaning": "設定可能なすべての候補 $\\mathcal{X}$ の中から、モデルの検証エラー $f(x)$ を最小にする最適な設定値 $x^*$ を探すことを表します。"}, {"expression": "\\text{EI}(x) = \\mathbb{E}\\left[\\max(0, f_{\\text{best}} - f(x))\\right]", "meaning": "設定 $x$ を試したときに、これまでの最高記録 $f_{\\text{best}}$ をどれくらい更新できそうかという期待値（Expected Improvement）を計算する式です。"}], "addedDate": "2026-10-25"}, {"paperId": "aa9635e531de729d47c9f166c388cd5ff0feeaaf", "arxivId": "", "title": "BrainGNN: Interpretable Brain Graph Neural Network for fMRI Analysis", "year": 2020, "published": "2020", "categories": [], "citationCount": 904, "influentialCitationCount": 90, "url": "https://www.semanticscholar.org/paper/aa9635e531de729d47c9f166c388cd5ff0feeaaf", "summary": "脳の活動を画像化するfMRIデータを分析して、特定の脳の病気や認知機能と関連する部位を発見するための研究です。従来のAIは予測精度が高くても「なぜその判断を下したのか」という根拠が分からず、医療現場での活用が難しいという問題がありました。そこで本研究は、脳の各部位のつながりをグラフ構造として捉え、判断の理由も説明できるAI「BrainGNN」を提案しました。このモデルは脳の解剖学的な特徴を考慮しながら学習し、病気の判定に重要だった特定の脳部位をハイライトして提示します。これにより、高い診断精度を達成するだけでなく、疾患の新しいバイオマーカー（診断の目印）の発見にも貢献します。", "terms": {"fMRI（機能的磁気共鳴画像法）": "脳の血流の変化を測定することで、脳のどの部分が活発に働いているかを可視化する検査技術です。", "グラフニューラルネットワーク (GNN)": "駅と路線のように、点（ノード）とそれらをつなぐ線（エッジ）で表現されたネットワーク構造データを処理するAIです。", "関心領域（ROI）": "分析や治療のために着目した、特定の機能や役割を持つ脳の解剖学的な領域のことです。", "説明可能性（解釈性）": "AIがなぜその結論や診断に至ったのか、その判断理由を人間が理解できるように提示できる性質のことです。"}, "formulas": [{"expression": "H^{(l+1)} = \\sigma\\left(\\tilde{D}^{-\\frac{1}{2}} \\tilde{A} \\tilde{D}^{-\\frac{1}{2}} H^{(l)} W^{(l)}\\right)", "meaning": "脳の各部位の特徴 $H^{(l)}$ を、神経のつながり具合を示す行列 $\\tilde{A}$ を介して隣り合う部位同士で混ぜ合わせ、次の特徴 $H^{(l+1)}$ へと更新する計算です。"}, {"expression": "\\mathcal{L}_{\\text{total}} = \\mathcal{L}_{\\text{task}} + \\lambda_1 \\mathcal{L}_{\\text{sparse}} + \\lambda_2 \\mathcal{L}_{\\text{consist}}", "meaning": "病気の予測精度を高める損失 $\\mathcal{L}_{\\text{task}}$ に、注目する脳領域を少数に絞る制約や判定理由の一貫性を保つ制約を組み合わせて学習することを表す式です。"}], "addedDate": "2026-10-25"}, {"paperId": "dc3e905bfb27d21675ee1720413e007b014b37d3", "arxivId": "1606.02647", "title": "Safe and Efficient Off-Policy Reinforcement Learning", "year": 2016, "published": "2016", "categories": [], "citationCount": 719, "influentialCitationCount": 90, "url": "https://arxiv.org/abs/1606.02647", "summary": "強化学習において、過去の異なる行動データを使って効率よく学習する手法（オフポリシー学習）に関する論文です。一般的に過去のデータをそのまま使うと、現在の自分の戦略と過去の行動のズレが原因で学習が不安定になったり、分散が大きくなって計算が破綻したりする難点がありました。研究チームは過去の様々な学習アルゴリズムを統一的な枠組みで見直し、「Retrace(\\lambda)」という新しいアルゴリズムを考案しました。この手法は、過去のデータがどんな行動ルールで収集されたものであっても安全に活用でき、計算のブレも小さく抑えられます。過去の失敗データや他人のデータも無駄にせず、安全かつ最高水準の効率で学習を進められるようになりました。", "terms": {"オフポリシー（Off-Policy）": "AIが今学ぼうとしている方針とは異なる、過去の方針や他者が集めた記録データを再利用して学習する枠組みのことです。", "分散": "推定値や計算結果が試行ごとにどれくらい大きくバラつくかを示す度合いで、これが高いと学習が不安定になります。", "行動価値関数（Q値）": "ある状況である行動をとった場合、その後最終的にどれくらいのトータル報酬が得られるかを予測した値です。", "刈り込み（クリッピング）": "過去の行動確率と現在の行動確率の比率が極端に大きくなりすぎないよう、上限を設けて強制的に抑え込む手法です。"}, "formulas": [{"expression": "c_s = \\min\\left(1, \\frac{\\pi(a_s | x_s)}{\\mu(a_s | x_s)}\\right)", "meaning": "現在のルール $\\pi$ と過去のルール $\\mu$ の確率比が1を超えないよう上限をかけることで、計算のブレ（分散）が爆発するのを防ぐ刈り込み係数です。"}, {"expression": "\\Delta Q(x, a) = \\sum_{t=0}^\\infty \\gamma^t \\left( \\prod_{s=1}^t c_s \\right) \\delta_t", "meaning": "各ステップの予測誤差 $\\delta_t$ に割引率 $\\gamma$ と安定化係数 $c_s$ を掛け合わせて合計し、価値関数 $Q$ の修正量を安全に計算する式です。"}], "addedDate": "2026-10-25"}, {"paperId": "858f0643110ccccb6a9103747f2169fecfb98668", "arxivId": "2308.15070", "title": "DiffBIR: Towards Blind Image Restoration with Generative Diffusion Prior", "year": 2023, "published": "2023", "categories": [], "citationCount": 357, "influentialCitationCount": 90, "url": "https://arxiv.org/abs/2308.15070", "summary": "スマートフォン等で撮影したボケたりノイズが入ったりした低画質画像を、綺麗で鮮明な画像へ修復する技術に関する研究です。現実の画像はどのような原因で劣化したかが事前には分からないため、従来の手法では不自然な歪みが生じたり、細部がぼやけたままになったりしていました。そこで本論文は、修復作業を「ノイズやボケを除去する段階」と「失われた細部を描き直す段階」の2つに切り分けた「DiffBIR」を提案しました。第2段階では画像生成で有名な拡散モデルの能力を活用し、布の質感や髪の毛などのリアルなディテールを違和感なく補完します。この分割アプローチにより、未知の激しい劣化がある画像でも、自然で高精細な画像へと復元できます。", "terms": {"ブラインド画像修復": "画像がどのように汚れたか（ボケ、圧縮ノイズ、解像度低下など）の原因が分からない状態で、元の綺麗な画像に戻す技術です。", "拡散モデル": "画像に少しずつノイズを加えて壊す手順を学び、その逆をたどることで何もないノイズから鮮明な画像を復元・生成するAIモデルです。", "生成事前知識（Generative Prior）": "大量の画像を見て育ったAIが頭の中に持っている、「本物の写真や物体はどのような見た目をしているか」という常識的な知識のことです。", "アーティファクト": "画像の処理や圧縮の失敗によって生じる、モザイク状の四角い跡や輪郭のギザギザなど不自然な見た目の乱れのことです。"}, "formulas": [{"expression": "y = (x \\otimes k) \\downarrow_s + n", "meaning": "元の綺麗な画像 $x$ にボケ $k$ が加わり、サイズが縮小され（$\\downarrow_s$）、さらにノイズ $n$ が混ざって低画質画像 $y$ が作られる劣化の仕組みを表す式です。"}, {"expression": "\\mathcal{L}_{\\text{diff}} = \\mathbb{E}_{t, x_0, \\epsilon} \\left[ \\| \\epsilon - \\epsilon_\\theta(x_t, t, c) \\|^2 \\right]", "meaning": "低画質画像をヒント $c$ として与え、拡散モデルが画像 $x_t$ に含まれるノイズ $\\epsilon$ をどれだけ正確に見抜いて除去できているかを評価する損失関数です。"}], "addedDate": "2026-10-25"}, {"paperId": "532c7d150d7bfece96e3c51ad0c8e4e18271912c", "arxivId": "2505.22617", "title": "The Entropy Mechanism of Reinforcement Learning for Reasoning Language Models", "year": 2025, "published": "2025", "categories": [], "citationCount": 485, "influentialCitationCount": 89, "url": "https://arxiv.org/abs/2505.22617", "summary": "複雑な数学や論理パズルを解く大規模言語モデル（LLM）に強化学習を適用すると、思考能力を大きく伸ばせることが知られています。しかし学習を進めると、モデルが試行錯誤する多様性を急激に失い、初期の段階で性能が頭打ちになる「エントロピーの崩壊」という壁がありました。本論文では、モデルが答えの候補を探す幅（エントロピー）と最終的な正答率との間に、数式で表せる明確な変換法則が存在することを発見しました。この法則に基づいて多様性を適切に維持するように介入することで、モデルが新しい解法を粘り強く探索し続けられるようになります。結果として、モデルの論理的推論力をより高い水準まで引き上げることに成功しました。", "terms": {"大規模言語モデル (LLM)": "膨大なテキストデータを学習し、人間のような自然な文章の生成や高度な論理推論ができるAIモデルです。", "方策エントロピー": "モデルが次の単語や答えを選ぶときに、どれくらい多様な選択肢を広く考慮しているかを表す「思考の幅広さ」の指標です。", "探索と活用のトレードオフ": "より良い新しい答えを探すこと（探索）と、すでに知っている正しそうな答えを選ぶこと（活用）のバランスに関する問題です。", "推論モデル": "単に知識を答えるだけでなく、結論に至るまでの思考のステップ（思考の連鎖）を自ら組み立てて問題を解くAIのことです。"}, "formulas": [{"expression": "H(\\pi) = - \\sum_{y} \\pi(y | x) \\log \\pi(y | x)", "meaning": "問題 $x$ に対してモデル $\\pi$ が答え $y$ を出力する際の確率の散らばり具合（エントロピー）を計算し、思考の多様性を数値化する式です。"}, {"expression": "R = -a \\cdot e^H + b", "meaning": "エントロピー $H$ とモデルの獲得報酬 $R$ の間に成り立つ変換方程式で、多様性が急速に失われると性能向上が止まるメカニズムを示しています。"}], "addedDate": "2026-10-25"}, {"paperId": "6661802f5e1ee004c20a28dcce9b582d4b5fe6d7", "arxivId": "", "title": "A Survey on Hate Speech Detection using Natural Language Processing", "year": 2017, "published": "2017", "categories": [], "citationCount": 1449, "influentialCitationCount": 88, "url": "https://www.semanticscholar.org/paper/6661802f5e1ee004c20a28dcce9b582d4b5fe6d7", "summary": "SNSの普及に伴い、ネット上で特定の人種やグループを中傷・攻撃するヘイトスピーチが急増し、深刻な社会問題となっています。人の手ですべての投稿を監視することは不可能であるため、AIによる自然言語処理技術を使って自動で検出する試みが進められています。本論文は、コンピューターが文章から悪意ある差別発言をどのように見分けるかについて、これまでの研究動向を整理した調査論文です。単語の出現頻度を見る初歩的な方法から高度な機械学習モデルまでの手法をまとめるとともに、データの偏りや皮肉の検知といった現在の限界についても議論しています。安全なネット環境を作るためのAI技術の現状と課題を幅広く把握できます。", "terms": {"ヘイトスピーチ": "人種、宗教、性別、性的指向などを理由に、特定の集団や個人を攻撃、脅迫、侮辱する悪意ある発言のことです。", "自然言語処理 (NLP)": "人間が日常的に使っている言葉（日本語や英語などのテキスト）をコンピューターに理解・処理させる技術分野です。", "特徴量エンジニアリング": "AIが文章の意味を判断しやすいように、特定の罵倒語の有無や文法構造などを数値データとして抽出する作業です。", "クラス不均衡": "SNS全体の投稿のうち、ヘイトスピーチはごく一部であるため、正解と不正解のデータ数に極端な偏りが生じる問題のことです。"}, "formulas": [{"expression": "F_1 = 2 \\cdot \\frac{\\text{Precision} \\cdot \\text{Recall}}{\\text{Precision} + \\text{Recall}}", "meaning": "ヘイトスピーチを見逃さない能力（再現率）と、誤って普通の発言を誤検知しない正確さ（適合率）をバランスよく評価する指標です。"}, {"expression": "\\text{TF-IDF}(t, d) = \\text{TF}(t, d) \\times \\log\\left(\\frac{N}{\\text{DF}(t)}\\right)", "meaning": "その投稿の中でよく使われている単語でありながら、全体の投稿ではめったに出現しない特徴的な言葉（罵倒語など）を数値化して目立たせる計算式です。"}], "addedDate": "2026-10-25"}, {"paperId": "de28ec1d7bd38c8fc4e8ac59b6133800818b4e29", "arxivId": "1902.07669", "title": "ScispaCy: Fast and Robust Models for Biomedical Natural Language Processing", "year": 2019, "published": "2019", "categories": [], "citationCount": 911, "influentialCitationCount": 87, "url": "https://arxiv.org/abs/1902.07669", "summary": "医学や生物学の論文や電子カルテには専門用語や略語が多く、一般的な文章向けに作られたAIでは正しく文構造や単語の意味を読み取れませんでした。また、医療現場やバイオ研究で実用化するには、巨大なモデルではなくパソコン上で高速かつ軽快に動くツールが必要とされていました。そこで本研究は、高速な文章解析ライブラリ「spaCy」をベースにして、生命科学テキストに特化したAIツールキット「scispaCy」を開発しました。このツールは、難解な医学論文から病名、薬品名、細胞名などを正しく識別し、文の区切りを正確に見極めることができます。誰でも手軽に利用できるよう公開されており、膨大な医学文献からの知識抽出を強力に後押しします。", "terms": {"ドメインシフト": "一般的なニュース記事などで学習したAIが、専門分野（医学など）の文章を読んだときに、言葉の違いから性能が著しく落ちてしまう現象です。", "固有表現抽出 (NER)": "文章の中から「病名」「遺伝子名」「化学物質」などの特定のカテゴリに属する専門単語を見つけ出し分類するタスクです。", "トークン化": "文章をAIが処理しやすいように、単語や記号などの最小単位（トークン）に切り分ける最初の処理ステップです。", "オープンソース": "作成したプログラムの設計図（ソースコード）を無償で一般公開し、誰でも自由に利用や改良ができるようにした形態です。"}, "formulas": [{"expression": "\\mathcal{L} = - \\sum_{i=1}^N \\log P(y_i | x_i)", "meaning": "文章中の各単語 $x_i$ に対して、AIが正解の品詞や固有表現ラベル $y_i$ を正しく予測できた確率の低さにペナルティを与える損失関数です。"}, {"expression": "\\text{Precision} = \\frac{\\text{TP}}{\\text{TP} + \\text{FP}}", "meaning": "AIが「専門用語（薬品名など）である」と判定したもののうち、実際に本当に正解だった単語の割合（適合率）を示す計算式です。"}], "addedDate": "2026-10-25"}, {"paperId": "1ab39085672b72634ff35fb00d795a6768fb90d0", "arxivId": "", "title": "Author Manuscript, Published in \"ieee Conference on Computer Vision and Pattern Recognition, San Francisco : United States Face Recognition Based on Image Sets", "year": null, "published": "None", "categories": [], "citationCount": 375, "influentialCitationCount": 87, "url": "https://www.semanticscholar.org/paper/1ab39085672b72634ff35fb00d795a6768fb90d0", "summary": "従来の顔認識は1枚の静止画像同士を比較することが主流でしたが、照明や角度の変化に弱いという課題がありました。そこで本研究では、1人の人物につき複数の画像が集まった「画像セット」同士を比較する手法を検討しています。画像セット全体を数学的な部分空間や曲面（多様体）として表現し、セット同士の幾何学的な距離や角度を測ることで照合を行います。これにより、顔の向きや表情が異なる写真が混ざっていても、個人を頑健に特定できるようになりました。", "terms": {"画像セット (Image Set)": "一人の人物に対して撮影された複数の顔写真や動画フレームをひとまとめにしたデータの集まりです。", "部分空間 (Subspace)": "画像データの集まりが持つ共通の特徴を、数学的な空間の広がりとして表現したものです。", "主角度 (Principal Angles)": "2つの異なる部分空間がどれくらい似ているかを測るための、空間同士がなす角度のことです。"}, "formulas": [{"expression": "d(S_1, S_2) = \\arccos(\\cos \\theta_1)", "meaning": "2つの画像セット（部分空間 $S_1$ と $S_2$）の類似度を、最も近い方向同士がなす最小の主角度 $\\theta_1$ から計算する距離の指標です。"}, {"expression": "X = U \\Sigma V^T", "meaning": "集めた画像行列 $X$ を特異値分解という手法で分解し、データの主要な変動パターンを取り出す計算です。"}], "addedDate": "2026-10-25"}, {"paperId": "71d62a6c0b84604a376174cf728e36d6f3c23f1e", "arxivId": "2411.15139", "title": "DiffusionDrive: Truncated Diffusion Model for End-to-End Autonomous Driving", "year": 2024, "published": "2024", "categories": [], "citationCount": 454, "influentialCitationCount": 85, "url": "https://arxiv.org/abs/2411.15139", "summary": "自動運転システムにおいて、周囲の状況から運転操作を直接予測する技術として生成モデルの一種である拡散モデルが注目されています。しかし、拡散モデルはノイズを少しずつ取り除く工程を何十回も繰り返すため、計算に時間がかかり車の即座な制御には間に合わないという問題がありました。そこで本論文では、ノイズ除去の計算回数を大幅に短縮した「切り詰め型」の拡散モデルを採用する手法を提案しています。これにより、周囲の複雑な交通状況に合わせた複数の走行ルート候補を瞬時に生成し、安全かつリアルタイムな自動運転を実現しました。", "terms": {"拡散モデル (Diffusion Model)": "データにノイズを混ぜる過程を逆にたどり、ノイズから元のリアルな行動や画像を復元する生成AI技術です。", "エンドツーエンド (End-to-End)": "カメラ映像などの入力から車のアクセルやハンドル操作などの出力までを、単一のAIで一貫して行う仕組みです。", "マルチモーダル行動分布 (Multi-mode Action Distribution)": "交差点を「右折する」か「直進する」かのように、状況に応じて複数の正解となり得る行動のパターンのことです。"}, "formulas": [{"expression": "x_{t-1} = \\frac{1}{\\sqrt{\\alpha_t}} \\left( x_t - \\frac{1 - \\alpha_t}{\\sqrt{1 - \\bar{\\alpha}_t}} \\epsilon_\\theta(x_t, t) \\right) + \\sigma_t z", "meaning": "現在のノイズ混じりの行動候補 $x_t$ から予測されたノイズ $\\epsilon_\\theta$ を差し引き、一歩きれいな行動 $x_{t-1}$ を復元する計算式です。"}, {"expression": "K < T", "meaning": "本来必要なノイズ除去ステップ数 $T$ に対して、途中で打ち切るステップ数 $K$ を極端に小さく設定して高速化を図る関係を示しています。"}], "addedDate": "2026-10-25"}, {"paperId": "3f13a5148f7caa51ea946193d261d4f8ed32d81a", "arxivId": "1811.06128", "title": "Machine Learning for Combinatorial Optimization: a Methodological Tour d'Horizon", "year": 2018, "published": "2018", "categories": [], "citationCount": 2001, "influentialCitationCount": 82, "url": "https://arxiv.org/abs/1811.06128", "summary": "配送ルートの最短経路を見つける「巡回セールスマン問題」のような組合せ最適化問題は、選択肢が爆発的に増えるため完璧な解を早く見つけることが非常に困難です。従来は専門家が経験に基づいて作ったルール（経験則）を頼りに計算の無駄を省いていましたが、問題ごとにルールを作り直す負担がありました。本論文は、そうした経験則の作成や意思決定を機械学習に肩代わりさせる研究の流れを体系的に整理したサーベイです。過去の計算履歴や問題のデータから解き方の規則をAIに学習させ、膨大な選択肢を賢く探索する道筋を解説しています。", "terms": {"組合せ最適化 (Combinatorial Optimization)": "膨大な組み合わせの中から、コストが最小になるような最適な選択肢を見つけ出す数学的な問題です。", "ヒューリスティクス (Heuristics)": "厳密な正解を保証する代わりに、短時間で実用的な良い解を見つけるための経験的な手順やルールのことです。", "巡回セールスマン問題 (Traveling Salesperson Problem, TSP)": "すべての都市をちょうど1回ずつ訪れて出発点に戻る最短の移動ルートを求める代表的な組合せ最適化問題です。"}, "formulas": [{"expression": "\\min_{x \\in \\mathcal{S}} f(x)", "meaning": "離散的な解の候補の集合 $\\mathcal{S}$ の中から、目的のコスト関数 $f(x)$ を最小にする最適な要素 $x$ を選ぶ問題の基本形を表します。"}, {"expression": "y = \\pi_\\theta(s)", "meaning": "現在の探索状況 $s$ を入力として、ニューラルネットワーク $\\pi_\\theta$ がどの枝を探索すべきかの決定 $y$ を出力する方針を表します。"}], "addedDate": "2026-10-25"}, {"paperId": "270195c8ecc14b98a206461282b88f8fae798932", "arxivId": "2206.00272", "title": "Vision GNN: An Image is Worth Graph of Nodes", "year": 2022, "published": "2022", "categories": [], "citationCount": 684, "influentialCitationCount": 81, "url": "https://arxiv.org/abs/2206.00272", "summary": "画像をコンピュータで扱う際、従来は格子状のマス目として処理する畳み込みや、細切れの列として処理する手法が主流でした。しかし、人間や物体などの対象物は形が不規則であり、マス目や直線的な順序だけでは柔軟に関係性を捉えにくい欠点がありました。そこで本論文では、画像を小さな断片（ノード）に分割し、それらの位置や見た目の近さに応じて線（エッジ）で結ぶ「グラフ」として扱う新しい手法を提案しています。この構造により、遠く離れた部位同士でも関連がある部分を効率よく連結して特徴を抽出できるようになりました。", "terms": {"グラフニューラルネットワーク (GNN)": "点（ノード）とそれらを結ぶ線（エッジ）で表されるネットワーク構造のデータを処理するAI手法です。", "パッチ (Patch)": "1枚の画像をモザイクのように細かく切り分けた小さな正方形の画像ブロックのことです。", "ノード (Node) とエッジ (Edge)": "グラフを構成する要素で、ノードはデータ点（ここでは画像パッチ）、エッジは点同士の結びつきやつながりを表します。"}, "formulas": [{"expression": "\\mathcal{G} = (\\mathcal{V}, \\mathcal{E})", "meaning": "画像をパッチの集合であるノード $\\mathcal{V}$ と、パッチ間の関連性を表すエッジ $\\mathcal{E}$ からなるグラフ $\\mathcal{G}$ として定義する式です。"}, {"expression": "x_i' = h_\\Theta \\left( x_i, \\max_{j \\in \\mathcal{N}(i)} g_\\phi(x_j - x_i) \\right)", "meaning": "あるパッチ $x_i$ の特徴を、隣接する近しいパッチ $x_j$ との差分情報を集約して更新するグラフ畳み込みの計算です。"}], "addedDate": "2026-10-25"}, {"paperId": "8c54e8575e7c17a4097838305915e6e7b00fd4af", "arxivId": "1910.11956", "title": "Relay Policy Learning: Solving Long-Horizon Tasks via Imitation and Reinforcement Learning", "year": 2019, "published": "2019", "categories": [], "citationCount": 594, "influentialCitationCount": 79, "url": "https://arxiv.org/abs/1910.11956", "summary": "引き出しを開けて中の物を掴み別の場所へ運ぶといった、複数の段階からなる長時間のロボット操作をAIに学習させることは困難でした。手本をそのまま真似る模倣学習だけでは少しの失敗から復帰できず、強化学習だけでは試行錯誤の道のりが長すぎるためです。本研究では、この問題をリレー競技のように段階的に引き継ぎながら解決する学習手法を提案しています。まず人間の実演データから大まかな目標別の行動を学習し、その次に各段階をスムーズにつなぎ合わせるように環境内で反復練習させて精度を高めました。", "terms": {"模倣学習 (Imitation Learning)": "人間のお手本となる操作データを見せて、それを真似させることで行動を身につけさせる学習手法です。", "強化学習 (Reinforcement Learning)": "AIが環境の中で試行錯誤を繰り返し、成功報酬を最大化するように行動基準を自発的に上達させる手法です。", "長期間タスク (Long-Horizon Task)": "完了するまでに多くの連続した動作や細かい工程をこなす必要がある、長丁場の作業のことです。"}, "formulas": [{"expression": "\\pi(a | s, g)", "meaning": "現在のロボットの状態 $s$ と目指すべき中間目標 $g$ が与えられたときに、取るべき行動 $a$ を決める方針（ポリシー）を表します。"}, {"expression": "J(\\theta) = \\mathbb{E} \\left[ \\sum_{t=0}^T r(s_t, a_t) \\right]", "meaning": "開始から終了までの各ステップで得られる報酬 $r$ の合計を最大化するように、方針のパラメータ $\\theta$ を最適化する目的関数です。"}], "addedDate": "2026-10-25"}, {"paperId": "c947c89c4a709ad27fe4590294589196642b0214", "arxivId": "", "title": "Destruction and Construction Learning for Fine-Grained Image Recognition", "year": 2019, "published": "2019", "categories": [], "citationCount": 484, "influentialCitationCount": 79, "url": "https://www.semanticscholar.org/paper/c947c89c4a709ad27fe4590294589196642b0214", "summary": "鳥の品種や車の車種を識別するような細分類タスクでは、くちばしの形やランプの模様といったごく小さな違いを見分ける必要があります。しかし、通常のAIは対象全体の輪郭など目立つ部分ばかりに着目してしまい、細部を見落としがちでした。そこで本論文では、画像をわざとパズル状にバラバラに破壊し、それを正しい位置に再構築させる訓練手法を提案しています。全体的な形の手がかりを強制的に奪うことで、AIは部分的な微細パターンを注意深く観察するよう鍛えられ、識別精度が向上しました。", "terms": {"細分類 (Fine-Grained Recognition)": "「鳥」と見分けるだけでなく「どの種類の鳥か」のように、非常によく似た同一カテゴリ内の細かな差異を判別するタスクです。", "破壊学習 (Destruction Learning)": "画像をグリッド状に分割してシャッフルし、AIが全体の一貫性だけに頼れないようにする学習工程です。", "再構築学習 (Construction Learning)": "バラバラにされたパッチの元の位置関係を復元させることで、物体の構造や配置の規則性を学ばせる工程です。"}, "formulas": [{"expression": "L = L_{cls} + \\alpha L_{dest} + \\beta L_{loc}", "meaning": "全体の損失関数であり、本来の分類誤差 $L_{cls}$ に、破壊された画像での誤差 $L_{dest}$ と領域位置当ての誤差 $L_{loc}$ を重み付けして足し合わせたものです。"}, {"expression": "p = \\text{softmax}(W f + b)", "meaning": "画像から抽出した特徴ベクトル $f$ をもとに、どのカテゴリに属するかという確率分布 $p$ を算出する一般的な数式です。"}], "addedDate": "2026-10-25"}, {"paperId": "ce2d5b5856bb6c9ab5c2390eb8b180c75a162055", "arxivId": "1708.02709", "title": "Recent Trends in Deep Learning Based Natural Language Processing", "year": 2017, "published": "2017", "categories": [], "citationCount": 3120, "influentialCitationCount": 77, "url": "https://arxiv.org/abs/1708.02709", "summary": "人間の言葉をコンピュータに理解させる自然言語処理では、単語の意味の曖昧さや文脈の複雑さをどう扱うかが長年の課題でした。本論文は、単語を数値ベクトルに変換する技術から、文章の文脈を考慮する深層学習モデルの発展までを網羅して概説した入門的なサーベイです。文章を順繰りに読むリカレントニューラルネットワークや、局所的な単語の並びを捉える畳み込みニューラルネットワークなどの特徴を整理しています。さらに、どの単語に注目すべきかを柔軟に切り替える注意機構（Attention）の重要性についても詳細に述べています。", "terms": {"分散表現 (Word Embedding)": "単語の意味を「王様」「女王」のように多次元の数値ベクトルに変換し、コンピュータが計算できるようにする技術です。", "再帰型ニューラルネットワーク (RNN)": "過去の単語の情報を内部に記憶しながら、文章を順番に1単語ずつ読み込んでいくモデルです。", "注意機構 (Attention Mechanism)": "文章を処理する際、文脈の中で特に関連が深い重要な単語に焦点を当てて重み付けを行う仕組みです。"}, "formulas": [{"expression": "h_t = \\tanh(W x_t + U h_{t-1} + b)", "meaning": "RNNにおいて、1つ前の時点の記憶 $h_{t-1}$ と新しく入力された単語 $x_t$ を組み合わせて現在の記憶状態 $h_t$ を更新する式です。"}, {"expression": "c = \\sum_{i} \\alpha_i h_i", "meaning": "各単語の重要度を表す重み $\\alpha_i$ を単語の特徴 $h_i$ に掛けて合計し、注目すべき文脈ベクトル $c$ を作る計算です。"}], "addedDate": "2026-10-25"}, {"paperId": "4f73a26f7c2c942d7f1b8267e1307d6f5207613b", "arxivId": "2112.07804", "title": "Tackling the Generative Learning Trilemma with Denoising Diffusion GANs", "year": 2021, "published": "2021", "categories": [], "citationCount": 807, "influentialCitationCount": 77, "url": "https://arxiv.org/abs/2112.07804", "summary": "画像などを生み出す生成AIには「画質の高さ」「生成バリエーションの豊富さ」「出力の素早さ」の3つが求められますが、従来の技術はいずれかを犠牲にしていました。拡散モデルは画質と多様性に優れるものの、何百回もノイズ除去を繰り返すため生成に膨大な時間がかかる弱点がありました。そこで本研究では、拡散モデルの1ステップあたりの大きなノイズ除去を敵対的生成ネットワーク（GAN）に担当させる手法を提案しています。これにより、計算ステップ数をわずか数回に減らしながらも、美しく多様な画像を瞬時に生成することに成功しました。", "terms": {"生成学習のトリレンマ (Generative Learning Trilemma)": "画像の質の高さ、多様なパターンの網羅、生成速度の速さの3つを同時に満たすことが極めて難しいという課題です。", "敵対的生成ネットワーク (GAN)": "偽物を作る「生成者」と見破る「識別者」を競わせることで、1回の計算でリアルなデータを作り出す生成モデルです。", "サンプリング (Sampling)": "学習した確率モデルからノイズを変換して、新しい画像などの実データを具体的に作り出す処理のことです。"}, "formulas": [{"expression": "p_\\theta(x_{t-1} | x_t)", "meaning": "ノイズが混ざった状態 $x_t$ から、1段階ノイズが取り除かれた状態 $x_{t-1}$ の分布を予測する条件付き確率です。"}, {"expression": "\\min_G \\max_D V(D, G)", "meaning": "識別者 $D$ が本物と偽物を最大限見分けようとし、生成者 $G$ がそれをごまかそうと競い合うGANの基本目的関数です。"}], "addedDate": "2026-10-25"}, {"paperId": "e70930b8a8c7ba7af5f3df13ecf7b60364a4c189", "arxivId": "2105.09111", "title": "Self-supervised Heterogeneous Graph Neural Network with Co-contrastive Learning", "year": 2021, "published": "2021", "categories": [], "citationCount": 574, "influentialCitationCount": 77, "url": "https://arxiv.org/abs/2105.09111", "summary": "SNSや学術ネットワークのように、ユーザー・投稿・商品など異なる種類の情報が混ざり合ったデータを「異種グラフ」と呼びます。これらをAIで解析するにはデータの正解ラベルが必要ですが、人間がラベルを1つずつ付与する作業には膨大な労力がかかっていました。本研究では、正解ラベルがなくてもデータ同士の類似関係を自力で学習できる「対照学習」を異種グラフに応用した手法を提案しています。異なる視点からグラフの構造を眺め、本質的に同じ要素同士を近づけ、異なる要素を遠ざけるようにAIを訓練することで、ラベルなしでも高い解析精度を達成しました。", "terms": {"異種情報ネットワーク (HIN)": "人や映画、監督のように、複数種類のノードとそれらを結ぶ多様な関係性を持つ複雑なネットワーク構造のことです。", "自己教師あり学習 (Self-Supervised Learning)": "人間が正解ラベルを与えなくても、データ自身の一部を問題として利用してAIが自力で学習する仕組みです。", "対照学習 (Contrastive Learning)": "似たもの同士（ポジティブ対）の特徴を近づけ、無関係なもの同士（ネガティブ対）を遠ざけるように学習する手法です。"}, "formulas": [{"expression": "\\mathcal{L}_{con} = -\\log \\frac{\\exp(\\text{sim}(z_i, z_j) / \\tau)}{\\sum_k \\exp(\\text{sim}(z_i, z_k) / \\tau)}", "meaning": "似た特徴を持つペア $(z_i, z_j)$ の類似度を分子で高め、その他の無関係なペアとの類似度を分母で抑える対照学習の損失関数です。"}, {"expression": "Z = \\text{HGNN}(\\mathcal{G}, X)", "meaning": "グラフの構造 $\\mathcal{G}$ と属性情報 $X$ を入力として、異種グラフニューラルネットワークがノードの特徴量表現 $Z$ を抽出する処理を示します。"}], "addedDate": "2026-10-25"}, {"paperId": "a23fbf6e7c224e696662b948163cb27e52188356", "arxivId": "1904.08298", "title": "Events-To-Video: Bringing Modern Computer Vision to Event Cameras", "year": 2019, "published": "2019", "categories": [], "citationCount": 515, "influentialCitationCount": 77, "url": "https://arxiv.org/abs/1904.08298", "summary": "イベントカメラは、一般的なカメラのように一定周期で画面全体を撮影するのではなく、明るさが変化した画素だけを瞬時に記録する新しいセンサーです。超高速で動く物体でもブレず、暗所から明所まで白飛びせずに捉えられる利点がありますが、出力が特殊な信号であるため既存の画像認識AIをそのまま使えませんでした。そこで本論文では、イベントの信号の集まりから滑らかな通常の白黒動画を再構成するニューラルネットワークを開発しました。復元した動画に対して既存の物体認識AIを通すことで、暗所や高速運動時でも高精度な認識を可能にしました。", "terms": {"イベントカメラ (Event Camera)": "1秒間に何十コマという撮影を行う代わりに、明るさが変化したピクセルとその時刻だけを非同期にマイクロ秒単位で出力するセンサーです。", "モーションブラー (Motion Blur)": "カメラの前を物体が素早く通り過ぎたりカメラが揺れたりしたときに、写真がブレて像が不鮮明になる現象のことです。", "ダイナミックレンジ (Dynamic Range)": "カメラが同時に捉えることができる、最も暗い部分から最も明るい部分までの明るさの幅（階調）のことです。"}, "formulas": [{"expression": "e_k = (x_k, y_k, t_k, p_k)", "meaning": "イベント信号1件の構成を表し、明るさが変化した座標 $(x_k, y_k)$、発生時刻 $t_k$、明るさが増加したか減少したかを示す極性 $p_k$ を示します。"}, {"expression": "I_t = f_\\theta(E_{\\Delta t}, h_{t-1})", "meaning": "直近の時間幅に届いたイベントの塊 $E_{\\Delta t}$ と過去の記憶 $h_{t-1}$ を使って、ニューラルネットワーク $f_\\theta$ が通常の輝度画像 $I_t$ を復元する式です。"}], "addedDate": "2026-10-25"}, {"paperId": "037df1500b9b8d4a57455b7ad205f86cc94a0b13", "arxivId": "2010.05337", "title": "DistDGL: Distributed Graph Neural Network Training for Billion-Scale Graphs", "year": 2020, "published": "2020", "categories": [], "citationCount": 347, "influentialCitationCount": 77, "url": "https://arxiv.org/abs/2010.05337", "summary": "SNSの友人関係やウェブサイトのリンク関係などは、点と線で表現される「グラフデータ」と呼ばれます。こうしたグラフを分析するAIであるグラフニューラルネットワークは、数億個以上の膨大なデータになると1台のコンピューターでは処理しきれませんでした。そこで本論文では、複数のコンピューターにデータを賢く分散して並列処理する仕組み「DistDGL」を開発しました。この仕組みにより、巨大なグラフを効率的に分割し、計算を高速化して通信の待ち時間を減らす工夫が施されています。その結果、数十億規模の巨大なデータであっても現実的な時間で高精度にAIモデルを学習できるようになりました。", "terms": {"グラフニューラルネットワーク（GNN）": "点（ノード）と線（エッジ）でつながったネットワーク状のデータを直接学習できるAIの仕組みです。", "ミニバッチ学習": "膨大なデータを一度に処理するのではなく、小さく分割したまとまりごとに計算してAIを賢くしていく方法です。", "分散学習": "巨大な計算処理を何台ものコンピューターに分担させ、協力して1つのAIモデルを作り上げる技術です。"}, "formulas": [{"expression": "h_v^{(l+1)} = \\sigma \\left( \\sum_{u \\in \\mathcal{N}(v)} W^{(l)} h_u^{(l)} \\right)", "meaning": "あるデータ点（ノード）の新しい特徴量を、その周りにつながっている別の点の特徴量を足し合わせて更新する計算式です。"}, {"expression": "\\mathcal{N}(v)", "meaning": "グラフ上で、着目しているノード $v$ に直接つながっている隣のノードの集まりを表します。"}], "addedDate": "2026-10-25"}, {"paperId": "0b6106e4e4bd18310fd81957625fc912ea403159", "arxivId": "2406.13897", "title": "CLAY: A Controllable Large-scale Generative Model for Creating High-quality 3D Assets", "year": 2024, "published": "2024", "categories": [], "citationCount": 574, "influentialCitationCount": 76, "url": "https://arxiv.org/abs/2406.13897", "summary": "ゲームやメタバースで使われる立体的な3Dモデルの作成は、高度な専門技術と多くの作業時間を必要としていました。本研究では、ユーザーが簡単なテキストや画像を入力するだけで、高品質な3D形状と質感を自動作成するAIモデル「CLAY」を提案しました。CLAYは、大まかなブロックの配置や複数視点の画像といった様々な入力方法にも対応し、制作者の意図通りの3Dモデルを作り出すことができます。内部では3D空間の幾何学的な構造と表面の質感を効率的に生成する拡散モデルが活用されています。これにより、専門技術を持たない人でも手軽に精密な3Dデジタル資産を創り出せるようになりました。", "terms": {"3Dアセット": "ゲームやCG映像、仮想空間などで使用される立体的な形状や質感のデータのことです。", "ボクセル": "立体空間を小さな立方体のブロックの集まりとして表現する、3D版のピクセルのような単位です。", "拡散モデル": "ノイズだらけの無意味な状態から徐々にノイズを取り除いていくことで、目的の画像や3Dモデルを作り出す生成AI技術です。"}, "formulas": [{"expression": "\\mathcal{L}_{\\text{diff}} = \\mathbb{E}_{t, x_0, \\epsilon} \\left[ \\| \\epsilon - \\epsilon_\\theta(x_t, t, c) \\|^2 \\right]", "meaning": "AIがノイズを取り除く能力を鍛えるための計算式で、予測したノイズと実際のノイズのズレを測っています。"}, {"expression": "x_t = \\sqrt{\\bar{\\alpha}_t} x_0 + \\sqrt{1 - \\bar{\\alpha}_t} \\epsilon", "meaning": "元の綺麗な3Dデータ $x_0$ に、段階 $t$ に応じた強さのランダムなノイズ $\\epsilon$ を加えていく式です。"}], "addedDate": "2026-10-25"}, {"paperId": "27302766f8d0eb6c052eb400e234c5be0e7a767e", "arxivId": "2109.11251", "title": "Trust Region Policy Optimisation in Multi-Agent Reinforcement Learning", "year": 2021, "published": "2021", "categories": [], "citationCount": 462, "influentialCitationCount": 76, "url": "https://arxiv.org/abs/2109.11251", "summary": "AIが試行錯誤しながら目標達成を目指す強化学習において、方針を少しずつ確実に良くする「信頼領域法」は単独のAIで高い成果を上げていました。しかし、複数のAIがチームとして協力する場面では、お互いの変更が衝突し、全体の方針が改善する保証がありませんでした。本論文では、複数のAIが同時に方針を更新してもチーム全体の性能が確実に向上することを理論的に保証する手法を提案しました。各AIが前の状態から極端に方針を変えすぎないよう制限を設け、1体ずつ順序立てて方針を更新するアルゴリズムを導入しています。これにより、協力プレイを行うゲームやロボットの協調制御などの複雑なタスクにおいて、安定して優れたチームプレイを学習させることが可能になりました。", "terms": {"マルチエージェント強化学習": "複数のAIキャラクターが同一の環境内でお互いに影響を与え合いながら学習を進める仕組みです。", "ポリシー（方策）": "AIが現在の状況を見たときに、次にどのような行動をとるべきかを決める行動計画やルールのことです。", "信頼領域法": "行動計画を一気に変えすぎて失敗しないよう、前回の計画と近い安全な範囲内だけで改善を試みる学習手法です。"}, "formulas": [{"expression": "J(\\boldsymbol{\\pi}) = \\mathbb{E} \\left[ \\sum_{t=0}^\\infty \\gamma^t r_t \\right]", "meaning": "AIチーム全員の行動計画 $\\boldsymbol{\\pi}$ に従って動いたときに、将来にわたって得られる報酬の合計値（期待値）を表します。"}, {"expression": "D_{\\text{KL}}(\\pi_{\\text{old}}^i(\\cdot|s) \\parallel \\pi^i(\\cdot|s)) \\le \\delta", "meaning": "エージェント $i$ が新しい行動計画に変える際、前の計画から離れすぎていないかどうかの距離を測り、上限値 $\\delta$ 以下に抑える制約です。"}], "addedDate": "2026-10-25"}, {"paperId": "89e83ee3eb95843292b1f75f0e50b89e7667b828", "arxivId": "2601.20802", "title": "Reinforcement Learning via Self-Distillation", "year": 2026, "published": "2026", "categories": [], "citationCount": 344, "influentialCitationCount": 76, "url": "https://arxiv.org/abs/2601.20802", "summary": "数学の証明やプログラミングのコード生成などでは、AIの出力が正しいか否かをテストによって自動で判定することができます。しかし、従来の強化学習では「正解なら1点、不正解なら0点」という単純な数値しかAIにフィードバックされず、どこが悪かったのかをAIが学ぶのが困難でした。本論文では、テストの実行時に得られるエラー文や詳細な判定理由といった「言葉のフィードバック」を直接活用する自己蒸留型の手法を提案しました。AI自身が失敗理由の解説を読んで反省し、その反省を踏まえたより賢い思考パターンを自分自身に教え込ませて学び直す仕組みです。その結果、単純な点数評価だけで学習するよりも効率的かつ高精度に、複雑な推論やコーディングを行う能力が向上しました。", "terms": {"強化学習": "AIが良い行動をしたときにはご褒美（報酬）を与え、試行錯誤を通じて最適な行動を学ばせる手法です。", "クレジット割り当て問題": "最終的に失敗した際、一連の行動の中の具体的にどこが失敗の原因だったのかを特定することが難しい問題です。", "自己蒸留": "AI自身が試行錯誤して得た深い理解や反省内容を、自分自身の基本モデルに教え直して賢くする学習方法です。"}, "formulas": [{"expression": "\\mathcal{L}_{\\text{distill}} = - \\sum_{t} \\log \\pi_\\theta(y_t \\mid y_{<t}, x, f)", "meaning": "フィードバック情報 $f$ を読んだ上で導き出された正しい解答の手順を、AIモデルが確実に真似できるように訓練するための損失関数です。"}, {"expression": "r \\in \\{0, 1\\}", "meaning": "コードのテストが通ったか否かなど、結果に対して与えられる従来の合否判定の報酬（1点または0点）を表します。"}], "addedDate": "2026-10-25"}, {"paperId": "97bfa89addc6e5d76361e4c1e296949cad887b86", "arxivId": "", "title": "Data Statements for Natural Language Processing: Toward Mitigating System Bias and Enabling Better Science", "year": 2018, "published": "2018", "categories": [], "citationCount": 1183, "influentialCitationCount": 72, "url": "https://www.semanticscholar.org/paper/97bfa89addc6e5d76361e4c1e296949cad887b86", "summary": "AIが自然な文章を読み書きする技術は急速に発展していますが、学習に使われたデータが偏っていると、偏見を持った危険なシステムが作られてしまう恐れがあります。本論文では、言語モデルなどの開発に使用するデータセットの身元や属性を明記する「データ・ステートメント」という仕様書の導入を提案しました。この書式には、データの収集元、書いた人々の年齢や地域、言語の特徴などの背景情報を詳細に記録することが推奨されます。これにより、開発者や研究者はシステムがどの集団向けに作られ、どのような偏りが生じ得るかを事前に把握できるようになります。透明性を高めるこの実践は、AIが意図せぬ差別や不具合を引き起こすリスクを未然に防ぐための重要な指針となります。", "terms": {"データ・ステートメント": "データセットにどのような人々のデータが含まれ、どんな背景で作られたかを詳しく説明した「食品の成分表示表」のような文書です。", "システムバイアス": "AIが特定の地域、性別、人種などのデータに偏って学習した結果、特定のグループに対して不公平な判断を下してしまう現象です。", "自然言語処理（NLP）": "人間が日常的に使っている日本語や英語などの言葉を、コンピューターに理解・処理させる技術のことです。"}, "formulas": [], "addedDate": "2026-10-25"}, {"paperId": "9a8e6feb271bf1cce8b1393cf41e70692a7f6625", "arxivId": "1805.08328", "title": "Verifiable Reinforcement Learning via Policy Extraction", "year": 2018, "published": "2018", "categories": [], "citationCount": 438, "influentialCitationCount": 72, "url": "https://arxiv.org/abs/1805.08328", "summary": "ニューラルネットワークを使った強化学習は複雑なゲームや制御を上手にこなしますが、内部の判断基準がブラックボックスなため、人命に関わる実用環境では安全性が保証できませんでした。そこで本論文では、学習を終えた複雑なAIから判断ルールを抽出し、人間にも理解しやすい「決定木」と呼ばれる樹形図の形に変換する手法を提案しました。この手法では、元の優秀なAIの動きを観察しながら、決定木型のモデルがその行動を忠実に真似するように模倣学習を行います。決定木は構造が明確であるため、既存の数学的な検査技術を用いて「危険な状態に絶対に陥らないか」を厳密に検証することが可能です。これにより、高い操作性能を保ちながら安全性をしっかりと証明できるAIが実現しました。", "terms": {"深層強化学習": "人間の脳を模した多層のニューラルネットワークを使って、複雑な環境での試行錯誤から行動を学ぶ技術です。", "決定木": "「もし温度が30度以上なら」のように、条件分岐を木のように枝分かれさせて最終的な結論を出す、分かりやすい判断モデルです。", "形式検証": "数学的な手法を用いて、システムが想定外の危険な動作を決して起こさないことを論理的にチェック・証明することです。"}, "formulas": [{"expression": "\\hat{\\pi} = \\arg\\min_{\\pi \\in \\Pi} \\mathbb{E}_{s \\sim \\mathcal{D}} [\\ell(s, \\pi^*(s), \\pi(s))]", "meaning": "元の複雑なAIの方策 $\\pi^*$ の行動と、新しい検証可能な方針 $\\pi$ の行動のズレ（損失 $\\ell$）を最小にするように決定木を選ぶ式です。"}, {"expression": "s \\in \\mathcal{S}", "meaning": "ロボットの位置や速度など、AIが置かれている環境の状態（ステート）の集合を表します。"}], "addedDate": "2026-10-25"}, {"paperId": "3e08a3912ebe494242f6bcd772929cc65307129c", "arxivId": "1706.03466", "title": "Few-Shot Image Recognition by Predicting Parameters from Activations", "year": 2017, "published": "2017", "categories": [], "citationCount": 595, "influentialCitationCount": 71, "url": "https://arxiv.org/abs/1706.03466", "summary": "人間は動物の写真を1、2枚見ただけで新しい動物の特徴を覚えられますが、従来のAIは何千枚もの画像を見せないと新しい物体を認識できませんでした。この課題に対して本論文は、すでに多くの画像を見て学習済みのAIを活用し、1〜3枚程度のわずかな見本からでも瞬時に新しいクラスを学習できる手法を提案しました。具体的には、新しい画像をAIに入力した際に内部で活発に反応した信号パターン（活性化）から、その画像を認識するためのAIの部品（重みパラメータ）を直接予測して作り出す補助ネットワークを構築しました。新しい画像を見るたびにいちいち時間をかけて再学習を行う必要がなくなります。この工夫により、未知のカテゴリが多数あるような状況でも、ごくわずかな画像だけで素早く正確に分類できるようになりました。", "terms": {"Few-Shot学習": "非常に少ないデータ（数枚の画像など）だけを与えられても、新しい概念や物体を正しく見分ける学習方法です。", "活性化（アクティベーション）": "画像などのデータが入力されたときに、AI内部の神経細胞（ニューロン）がどれくらい強く反応したかを示す数値です。", "重みパラメータ": "入力された情報にどれくらい注目すべきかを調整する、AI内部の調整つまみのような数値のことです。"}, "formulas": [{"expression": "w_c = g(z_c)", "meaning": "新しいカテゴリの画像から得られた反応特徴 $z_c$ をもとに、予測関数 $g$ を使ってそのカテゴリ専用の認識パラメータ $w_c$ を一気に作り出す式です。"}, {"expression": "P(y = c \\mid x) = \\frac{\\exp(w_c^T x)}{\\sum_{k} \\exp(w_k^T x)}", "meaning": "予測された重み $w_c$ と入力画像の特徴 $x$ をかけ合わせて、画像がカテゴリ $c$ に当てはまる確率を計算する式です。"}], "addedDate": "2026-10-25"}, {"paperId": "50d95d13c02dde5854cd3a5d7bbb8f91711f9730", "arxivId": "", "title": "Understanding Error Propagation in Deep Learning Neural Network (DNN) Accelerators and Applications", "year": 2017, "published": "2017", "categories": [], "citationCount": 629, "influentialCitationCount": 70, "url": "https://www.semanticscholar.org/paper/50d95d13c02dde5854cd3a5d7bbb8f91711f9730", "summary": "AIの計算を高速に行うための専用半導体チップは、スマートフォンや自動運転車など様々な機器に組み込まれています。しかし、微細化されたハードウェアチップは電圧の揺らぎや宇宙線などの影響で、内部の「0」と「1」が意図せず反転する微小なエラーを起こすことがあります。本論文では、そうした半導体内部のエラーがニューラルネットワークの各層を通過するうちにどのように広がり、最終的な判定ミスにつながるのかを体系的に分析しました。調査の結果、エラーが発生する場所によってAIが全く影響を受けないケースと、たった1ビットの狂いで判定が完全に狂ってしまう致命的なケースがあることが判明しました。この知見は、無駄なコストをかけずに本当に重要な部分だけを保護する高信頼なAIチップを設計するための基盤となりました。", "terms": {"DNNアクセラレータ": "ディープラーニング（深層学習）特有の大量の掛け算と足し算を高速・省電力で処理するために設計された専用ハードウェアチップです。", "ビット反転（ソフトエラー）": "物理的な衝撃や放射線などの影響で、メモリや計算機内のデータが「0から1」または「1から0」に勝手に書き換わってしまう偶発的な現象です。", "フォールトトレランス（耐障害性）": "システム内部に故障や計算エラーが発生しても、正しく機能を維持し続けられる頑丈さのことです。"}, "formulas": [{"expression": "w' = w \\oplus e", "meaning": "元の正常な重みデータ $w$ に対して、予期せぬビットエラー $e$ が加わって狂ってしまった異常値 $w'$ を表します。"}, {"expression": "y = f(W x + b)", "meaning": "ハードウェア内で実行される、入力データ $x$ に重み $W$ を掛けてバイアス $b$ を足し、関数 $f$ を通して次の層に出力するニューラルネットワークの基本計算です。"}], "addedDate": "2026-10-25"}, {"paperId": "56edaa1368ff4dfa45388e4be24fdfbded7d88a7", "arxivId": "1510.00726", "title": "A Primer on Neural Network Models for Natural Language Processing", "year": 2015, "published": "2015", "categories": [], "citationCount": 1259, "influentialCitationCount": 69, "url": "https://arxiv.org/abs/1510.00726", "summary": "言葉を処理する自然言語処理の分野では、かつては文法規則を手作業で作ったり統計学的な工夫に頼ったりしていました。本論文は、画像認識などで著しい成果を上げ始めていたニューラルネットワーク技術を、言語処理の研究者に向けて分かりやすく整理した入門解説書です。単語を空間上のベクトルとして表現する「単語の埋め込み」や、文章の並び順を捉えるネットワークなど、当時の重要技術を体系的に解説しています。複雑な数学的理論を噛み砕き、なぜこれらのネットワークが人間の書いた文の文脈や意味を上手に捉えられるのかを説明しています。言語処理にAIを取り入れたい初学者や研究者が基礎概念を包括的に把握するための基礎固めとなりました。", "terms": {"単語埋め込み（ワードエンベディング）": "「王様」や「リンゴ」といった言葉の意味を、コンピューターが計算できるように何百個かの数字の並び（ベクトル）に変換する技術です。", "多層パーセプトロン（MLP）": "入力層、中間層、出力層がシンプルに連なった、最も標準的なニューラルネットワークの基本形です。", "ソフトマックス関数": "AIが出力したバラバラな数値を、合計が100%になる確率の形にきれいに変換してくれる計算手法です。"}, "formulas": [{"expression": "\\hat{y} = \\text{softmax}(W x + b)", "meaning": "入力された単語の特徴 $x$ を計算し、それぞれの単語やカテゴリに分類される確率 $\\hat{y}$ を求める標準的な計算式です。"}, {"expression": "\\text{softmax}(z)_i = \\frac{e^{z_i}}{\\sum_{j} e^{z_j}}", "meaning": "各項目の数値 $z_i$ を指数関数に通して、全体の合計で割ることで、足して1（100％）になる確率へと整える式です。"}], "addedDate": "2026-10-25"}, {"paperId": "668075792a7ab40457d92e09da28d35c879271c3", "arxivId": "2501.12599", "title": "Kimi k1.5: Scaling Reinforcement Learning with LLMs", "year": 2025, "published": "2025", "categories": [], "citationCount": 1121, "influentialCitationCount": 69, "url": "https://arxiv.org/abs/2501.12599", "summary": "現在の大規模言語モデルは、インターネット上の大量の文章から次の言葉を予測することで賢くなってきましたが、人間が書いた文章データ自体の量には限界が近づいています。本論文では、モデルの規模をただ大きくするのではなく、強化学習を用いてAIが自ら試行錯誤を繰り返すことで推論能力を飛躍的に高める手法「Kimi k1.5」の開発報告を行いました。数学やプログラミングの問題を与え、長い思考過程の中で自ら間違いに気づいて修正するような探索行動に対して報酬を与える仕組みを採用しています。長文の文脈を巧みに扱いながら、安定して学習を続けられるように工夫されたトレーニング手法を確立しました。この成果により、人間が用意した知識を読むだけでなく、自力で深く考えて問題を解く次世代の知能へ発展できることが示されました。", "terms": {"大規模言語モデル（LLM）": "膨大なテキストデータを読み込むことで、人間のように自然な文章を生成したり質問に答えたりできる巨大なAIです。", "自己修正（セルフリフレクション）": "AIが思考を進める中で、「待てよ、この計算は間違っているかもしれない」と自らの出力を振り返り、訂正する能力のことです。", "スケーリング": "計算機のパワーや訓練時間、データ量を増やしていくことで、AIの知能や性能を着実に伸ばしていくことです。"}, "formulas": [{"expression": "\\nabla_\\theta J(\\theta) = \\mathbb{E} \\left[ \\sum_{t} \\nabla_\\theta \\log \\pi_\\theta(a_t \\mid s_t) A_t \\right]", "meaning": "AIが取った行動が良い結果（アドバンテージ $A_t$ がプラス）だった場合に、その思考パターンをより多く選ぶようパラメータ $\\theta$ を更新する方向を求める式です。"}, {"expression": "A_t = R_t - V(s_t)", "meaning": "実際に得られた報酬 $R_t$ が、普段のその状態での予想期待値 $V(s_t)$ と比べてどれくらい優れていたかを表す値です。"}], "addedDate": "2026-10-25"}, {"paperId": "948839277bface5780896e8e8791906818aa41ac", "arxivId": "1911.09665", "title": "Adversarial Examples Improve Image Recognition", "year": 2019, "published": "2019", "categories": [], "citationCount": 639, "influentialCitationCount": 68, "url": "https://arxiv.org/abs/1911.09665", "summary": "敵対的サンプルとは、人間の目には分からないわずかなノイズを加えることでAIに誤認を起こさせる画像であり、従来はAIの弱点と見なされていました。本論文ではこの敵対的サンプルを逆手に取り、追加の学習データとして活用することで画像認識の性能を底上げする手法「AdvProp」を提案しています。通常の画像とノイズ付き画像ではデータの特徴分布が異なるため、それぞれに対して専用の正規化処理を分けて適用することが工夫の要となっています。この方法により、AIが特定の画像だけに過剰に適応するのを防ぎ、未知の画像に対してもより正確に認識できるようになりました。", "terms": {"敵対的サンプル (Adversarial Examples)": "AIを意図的に勘違いさせるために、人間には見分けがつかない微小なノイズを加えた画像のことです。", "過学習 (Overfitting)": "学習に使ったデータには完璧に正解できるものの、初めて見るデータに対してはうまく対応できなくなる現象のことです。", "バッチ正規化 (Batch Normalization)": "AI内部で処理されるデータのばらつきを整えることで、学習をスムーズかつ安定に進めるための仕組みです。", "畳み込みニューラルネットワーク (ConvNets/CNN)": "画像の中から輪郭や模様などの特徴を捉えることが得意な、画像認識で広く使われるAIの仕組みです。"}, "formulas":
