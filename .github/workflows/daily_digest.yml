name: Daily ArXiv Digest → GitHub Pages + Slack

on:
  workflow_dispatch:

# docs/ への書き込みと GitHub Pages デプロイに必要
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest and HTML
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python digest.py

      - name: Commit and push generated HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # 変更がなければスキップ（ページが存在しない日など）
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "digest: $(date -u +%Y-%m-%d)" && git push
