name: Scholar Digest → AI論文まとめページ

on:
  schedule:
    # 10:00/16:00/22:00/04:00 JST (= 01:00/07:00/13:00/19:00 UTC)
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

jobs:
  scholar-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scholar digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python scholar_digest.py

      - name: Commit and push updated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/papers.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scholar: $(date -u +%Y-%m-%d)"
            git push
          fi
